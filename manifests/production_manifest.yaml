# Changeover matrix - time in minutes between product groups
changeover_matrix:
  A:
    A: 0     # Same group, no changeover
    B: 30    # Bottle to can
    C: 45    # Bottle to jug
    D: 60    # Bottle to pouch
  B:
    A: 30
    B: 0
    C: 40
    D: 55
  C:
    A: 45
    B: 40
    C: 0
    D: 50
  D:
    A: 60
    B: 55
    C: 50
    D: 0

