# Production Manifest
# Purpose: Provides CONFIGURATION VALUES for products and production orders
# This is separate from the ontology which defines structure

metadata:
  name: "Production Configuration"
  version: "1.0.0"
  description: "Product definitions and production schedule for virtual twin"
  created: "2025-01-18"

