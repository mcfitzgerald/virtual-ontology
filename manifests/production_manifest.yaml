# Scheduled events (changeovers are automatic between orders)
scheduled_events:
  changeovers:
    - type: "CHANGEOVER"
      from_product: "SKU-1001"
      to_product: "SKU-2001"
      line_id: "LINE1"
      start_time: 240
      duration: 45  # A to A group, but different family
      
    - type: "CHANGEOVER"
      from_product: "SKU-2002"
      to_product: "SKU-3002"
      line_id: "LINE1"
      start_time: 1680
      duration: 45  # C to A group
      
  maintenance:
    - type: "PLANNED_MAINTENANCE"
      line_id: "LINE1"
      start_time: 8640  # Sunday morning
      duration: 240  # 4 hours
      description: "Weekly preventive maintenance"
      
    - type: "PLANNED_MAINTENANCE"
      line_id: "LINE2"
      start_time: 8880  # Sunday afternoon
      duration: 180  # 3 hours
      description: "Weekly cleaning"
      
  breaks:
    - type: "BREAK"
      shift: "shift1"
      start_time: 240  # 10 AM
      duration: 15
      recurring: true
      interval: 1440  # Daily
      
    - type: "BREAK"
      shift: "shift1"
      start_time: 360  # 12 PM lunch
      duration: 30
      recurring: true
      interval: 1440

