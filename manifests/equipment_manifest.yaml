failure_patterns:
  Filler:
    micro_stops:
      cascade_probability: 0.1
      downtime_reason: UNP-SENS
      duration_range:
      - 1
      - 3
      probability_per_5min: 0.08
      recovery_factor: 1.0
    quality_deviation:
      cascade_probability: 0.05
      downtime_reason: UNP-QC
      duration_range:
      - 2
      - 5
      probability_per_5min: 0.05
      recovery_factor: 0.8
    valve_failure:
      cascade_probability: 0.2
      downtime_reason: UNP-MECH
      duration_range:
      - 10
      - 25
      probability_per_5min: 0.03
      recovery_factor: 1.2
  Packer:
    jam:
      cascade_probability: 0.25
      downtime_reason: UNP-JAM
      duration_range:
      - 5
      - 15
      probability_per_5min: 0.04
      recovery_factor: 1.1
    seal_failure:
      cascade_probability: 0.15
      downtime_reason: UNP-SEAL
      duration_range:
      - 2
      - 8
      probability_per_5min: 0.06
      recovery_factor: 1.0
  Palletizer:
    electrical_issue:
      cascade_probability: 0.3
      downtime_reason: UNP-ELEC
      duration_range:
      - 15
      - 45
      probability_per_5min: 0.02
      recovery_factor: 1.5
    operator_issue:
      cascade_probability: 0.05
      downtime_reason: UNP-OP
      duration_range:
      - 3
      - 10
      probability_per_5min: 0.025
      recovery_factor: 0.7
    software_fault:
      cascade_probability: 0.1
      downtime_reason: UNP-CTRL
      duration_range:
      - 5
      - 20
      probability_per_5min: 0.015
      recovery_factor: 0.9
maintenance_schedule:
  cleaning:
  - downtime_reason: PLN-CL
    duration: 30
    interval: 1440
    line_id: LINE1
  - downtime_reason: PLN-CL
