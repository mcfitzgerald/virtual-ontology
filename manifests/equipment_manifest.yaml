failure_patterns:
  Filler:
    micro_stops:
      cascade_probability: 0.15
      downtime_reason: UNP-MS
      duration_range:
      - 1
      - 3
      probability_per_5min: 0.3
      recovery_factor: 1.0
    quality_deviation:
      cascade_probability: 0.08
      downtime_reason: UNP-QC
      duration_range:
      - 2
      - 8
      probability_per_5min: 0.18
      recovery_factor: 0.8
    valve_failure:
      cascade_probability: 0.25
      downtime_reason: UNP-MECH
      duration_range:
      - 15
      - 35
      probability_per_5min: 0.096
      recovery_factor: 1.2
    sensor_issue:
      cascade_probability: 0.1
      downtime_reason: UNP-SENS
      duration_range:
      - 5
      - 15
      probability_per_5min: 0.036
      recovery_factor: 0.9
    material_shortage:
      cascade_probability: 0.3
      downtime_reason: UNP-MAT
      duration_range:
      - 10
      - 30
      probability_per_5min: 0.084
      recovery_factor: 1.1
  Packer:
    jam:
      cascade_probability: 0.3
      downtime_reason: UNP-JAM
      duration_range:
      - 5
      - 20
      probability_per_5min: 0.216
      recovery_factor: 1.1
    seal_failure:
      cascade_probability: 0.18
      downtime_reason: UNP-SEAL
      duration_range:
      - 3
      - 12
      probability_per_5min: 0.18
      recovery_factor: 1.0
    micro_stops:
      cascade_probability: 0.1
      downtime_reason: UNP-MS
      duration_range:
      - 1
      - 2
      probability_per_5min: 0.06
      recovery_factor: 0.9
    sensor_issue:
      cascade_probability: 0.12
      downtime_reason: UNP-SENS
      duration_range:
      - 5
      - 10
      probability_per_5min: 0.096
      recovery_factor: 0.95
  Palletizer:
    electrical_issue:
      cascade_probability: 0.35
      downtime_reason: UNP-ELEC
      duration_range:
      - 20
      - 60
      probability_per_5min: 0.06
      recovery_factor: 1.5
    operator_issue:
      cascade_probability: 0.08
      downtime_reason: UNP-OPR
      duration_range:
      - 5
      - 15
      probability_per_5min: 0.036
      recovery_factor: 0.7
    software_fault:
      cascade_probability: 0.15
      downtime_reason: UNP-CTRL
      duration_range:
      - 5
      - 25
      probability_per_5min: 0.084
      recovery_factor: 0.9
    jam:
      cascade_probability: 0.2
      downtime_reason: UNP-JAM
      duration_range:
      - 8
      - 25
      probability_per_5min: 0.18
      recovery_factor: 1.2
    micro_stops:
      cascade_probability: 0.05
      downtime_reason: UNP-MS
      duration_range:
      - 1
      - 3
      probability_per_5min: 0.18
      recovery_factor: 0.95
