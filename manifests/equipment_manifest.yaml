failure_patterns:
  Filler:
    micro_stops:
      cascade_probability: 0.15  # Increased cascade impact
      downtime_reason: UNP-MS    # Micro-stop code
      duration_range:
      - 1
      - 3
      probability_per_5min: 0.25  # Ultra-extreme for 69% availability
      recovery_factor: 1.0
    quality_deviation:
      cascade_probability: 0.08
      downtime_reason: UNP-QC     # Quality control stop
      duration_range:
      - 2
      - 8
      probability_per_5min: 0.15  # Very high
      recovery_factor: 0.8
    valve_failure:
      cascade_probability: 0.25   # Higher cascade for mechanical issues
      downtime_reason: UNP-MECH   # Mechanical failure
      duration_range:
      - 15
      - 35                        # Longer duration
      probability_per_5min: 0.08  # Very high
      recovery_factor: 1.2
    sensor_issue:                # Added new failure mode
      cascade_probability: 0.10
      downtime_reason: UNP-SENS   # Sensor failure
      duration_range:
      - 5
      - 15
      probability_per_5min: 0.03
      recovery_factor: 0.9
    material_shortage:           # Added material shortage
      cascade_probability: 0.30   # High cascade - starves downstream
      downtime_reason: UNP-MAT    # Material shortage
      duration_range:
      - 10
      - 30
      probability_per_5min: 0.07
      recovery_factor: 1.1
  Packer:
    jam:
      cascade_probability: 0.30  # Increased cascade
      downtime_reason: UNP-JAM
      duration_range:
      - 5
      - 20                       # Longer jams
      probability_per_5min: 0.18  # Very high
      recovery_factor: 1.1
    seal_failure:
      cascade_probability: 0.18
      downtime_reason: UNP-SEAL
      duration_range:
      - 3
      - 12
      probability_per_5min: 0.15  # Very high
      recovery_factor: 1.0
    micro_stops:                 # Added micro-stops for packers
      cascade_probability: 0.10
      downtime_reason: UNP-MS
      duration_range:
      - 1
      - 2
      probability_per_5min: 0.05  # 10x increase
      recovery_factor: 0.9
    sensor_issue:
      cascade_probability: 0.12
      downtime_reason: UNP-SENS
      duration_range:
      - 5
      - 10
      probability_per_5min: 0.08
      recovery_factor: 0.95
  Palletizer:
    electrical_issue:
      cascade_probability: 0.35  # High cascade impact
      downtime_reason: UNP-ELEC
      duration_range:
      - 20
      - 60                       # Longer electrical issues
      probability_per_5min: 0.05 # Electrical issues happen
      recovery_factor: 1.5
    operator_issue:
      cascade_probability: 0.08
      downtime_reason: UNP-OPR    # Corrected code
      duration_range:
      - 5
      - 15
      probability_per_5min: 0.03  # More operator issues
      recovery_factor: 0.7
    software_fault:
      cascade_probability: 0.15
      downtime_reason: UNP-CTRL
      duration_range:
      - 5
      - 25
      probability_per_5min: 0.07
      recovery_factor: 0.9
    jam:                         # Added jam for palletizers
      cascade_probability: 0.20
      downtime_reason: UNP-JAM
      duration_range:
      - 8
      - 25
      probability_per_5min: 0.15  # Very high
      recovery_factor: 1.2
    micro_stops:                 # Added micro-stops
      cascade_probability: 0.05
      downtime_reason: UNP-MS
      duration_range:
      - 1
      - 3
      probability_per_5min: 0.15  # Very high
      recovery_factor: 0.95
