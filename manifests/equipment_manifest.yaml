  peak_rate: 0.15
equipment:
  # Global failure timing parameters for mixture model
  failure_timing_config:
    # Mean time between failure events (in minutes)
    micro_stop_mean_time: 20.0  # Frequent micro-stops
    minor_failure_mean_time: 240.0  # 4 hours on average
    major_failure_mean_time: 2880.0  # 48 hours on average
    
    # Repair duration distributions
    # Micro-stops: Log-normal distribution (mostly 0.5-3 min)
    micro_stop_duration_mean: 0.0  # ln(1) = 0 for median of 1 minute
    micro_stop_duration_sigma: 0.5
    
    # Minor failures: Gamma distribution (5-30 min)
    minor_failure_duration_shape: 2.0
    minor_failure_duration_scale: 5.0
    
    # Major failures: Weibull distribution (30+ min with long tail)  
    major_failure_duration_shape: 2.0
    major_failure_duration_scale: 60.0
    
