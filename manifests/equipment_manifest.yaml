    interval: 1440
    line_id: LINE2
  - downtime_reason: PLN-CL
    duration: 30
    interval: 1440
    line_id: LINE3
  preventive:
  - downtime_reason: PLN-PM
    duration: 120
    equipment_id: LINE1-FIL
    interval: 10080
  - downtime_reason: PLN-PM
    duration: 90
    equipment_id: LINE1-PCK
    interval: 10080
  - downtime_reason: PLN-PM
    duration: 60
    equipment_id: LINE1-PAL
    interval: 10080
