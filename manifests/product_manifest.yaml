# Global changeover matrix overrides
changeover_matrix:
  # Define specific changeover requirements between product pairs
  # Format: from_product -> to_product -> requirements
  overrides:
    SKU-1002:  # From Juice
      SKU-1001:  # To Water
        cleaning_required: true
        time_minutes: 60
        cost: 1000
        reason: "allergen_control"
    
    SKU-3002:  # From Premium Juice
      SKU-1001:  # To Water
        cleaning_required: true
        time_minutes: 75
        cost: 1200
        reason: "deep_clean_required"

# Product family relationships
product_families:
  clear_liquids:
    products: ["SKU-1001"]
    characteristics: ["no_color", "no_pulp", "no_allergens"]
    
  fruit_juice:
    products: ["SKU-1002", "SKU-3002"]
    characteristics: ["contains_pulp", "natural_sugars", "vitamins"]
    
  carbonated:
    products: ["SKU-2001"]
    characteristics: ["co2_injection", "pressure_rated"]
    
  functional:
    products: ["SKU-2002", "SKU-3001"]
    characteristics: ["added_ingredients", "performance_compounds"]

# Cost factors for optimization
cost_factors:
  labor_cost_per_hour: 25.00
  energy_cost_per_kwh: 0.12
  waste_disposal_cost_per_kg: 0.05
  quality_inspection_cost_per_sample: 2.00
  expedite_cost_multiplier: 1.5
  overtime_cost_multiplier: 1.5
  
# Performance metrics targets
performance_targets:
  min_line_utilization: 0.70
  target_oee: 0.85
  max_scrap_rate: 0.05
  max_changeover_percentage: 0.15
  min_campaign_length_hours: 4.0