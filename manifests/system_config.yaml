# System Configuration Manifest
# Defines system-wide settings and control values for the virtual twin

metadata:
  name: "Twin System Configuration"
  version: "1.0.0"
  description: "System-level configuration for virtual twin simulation"
  created: "2024-12-20"
  author: "Virtual Twin System"

# ====================================================================================
# SYSTEM SETTINGS
# ====================================================================================
system:
  # Material flow configuration
  material_flow:
    mode: "continuous_flow"  # Container-based continuous flow
    implementation: "simpy.Container"
    default_queue_size: 20  # Legacy - kept for compatibility
  
  # Container flow control settings
  flow_control:
    default_buffer_capacity: 1000  # units
    default_production_interval: 0.1  # minutes (6 seconds)
    default_batch_size_min: 5  # minimum batch size
    monitoring_interval: 1.0  # minutes
    throughput_window: 5.0  # minutes for throughput calculation
    flow_rate_samples: 100  # number of samples to keep
    utilization_threshold: 0.8  # threshold for bottleneck detection
    
  # Startup configuration
  startup:
    warmup_period: 5.0  # Minutes before measuring KPIs
    initial_wip: true   # Start with material in queues
    initial_wip_level: 0.5  # 50% of queue capacity
    
  # Simulation settings
  simulation:
    time_unit: "minutes"
    default_duration: 10080  # 7 days in minutes
    random_seed: 42  # For reproducibility
    
  # Monitoring settings
  monitoring:
    kpi_interval: 5.0  # Minutes between KPI calculations
    state_tracking: true
    event_logging: true
    event_log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
    
  # Performance settings
  performance:
    use_sampling: true  # Sample events for performance
    sampling_rate: 0.1  # Sample 10% of events
    batch_processing: true
    batch_size: 100

# ====================================================================================
# FAILURE DISTRIBUTIONS - Realistic failure patterns for equipment
# ====================================================================================
failure_distributions:
  micro_stops:
    percentage: 0.60  # 60% of all failures are micro-stops
    occurrence:
      base_rate: 15.0  # One micro-stop every 15 minutes on average
    duration:
      mean: 1.0  # Average 1 minute duration
      sigma: 0.5  # Log-normal sigma for variation
      
  minor_failures:
    percentage: 0.30  # 30% of failures are minor
    base_interval: 120.0  # Every 2 hours on average
    weibull_shape: 2.0  # Shape > 1 indicates wear-out failures
    duration:
      mean: 15.0  # Average 15 minutes to repair
      range: [5.0, 30.0]
      
  major_failures:
    percentage: 0.10  # 10% of failures are major
    base_interval: 480.0  # Every 8 hours on average
    lognormal_sigma: 1.0  # High variability in major failures
    duration:
      mean: 60.0  # Average 1 hour to repair
      range: [30.0, 180.0]

# ====================================================================================
# CONTROL SETTINGS - Current values for actionable controls
# ====================================================================================
control_settings:
  # These are the "knobs" that can be turned
  # Values must be within bounds defined in ontology
  
  changeover_reduction_level: 1  # Basic SMED implementation
  operator_training_hours: 20    # 20 hours/month training
  line_speed_setting: 85         # 85% of theoretical max
  sensor_calibration_frequency: 7  # Weekly calibration
  product_sequencing_strategy: "changeover_optimized"
  pm_schedule_compliance: 80     # 80% PM compliance
  staffing_level: 2              # 2 operators per line
  autonomous_maintenance_level: 1  # Basic CIL

# ====================================================================================
# SCENARIO CONFIGURATIONS - Predefined control combinations
# ====================================================================================
scenarios:
  baseline:
    description: "Current state - realistic but poor performance"
    controls:
      changeover_reduction_level: 0
      operator_training_hours: 8
      line_speed_setting: 90
      sensor_calibration_frequency: 14
      product_sequencing_strategy: "random"
      pm_schedule_compliance: 60
      staffing_level: 2
      autonomous_maintenance_level: 0
    expected_oee: 0.55  # ~55% OEE
    
  quick_wins:
    description: "Low-cost improvements"
    controls:
      changeover_reduction_level: 1
      operator_training_hours: 16
      line_speed_setting: 85
      sensor_calibration_frequency: 7
      product_sequencing_strategy: "changeover_optimized"
      pm_schedule_compliance: 70
      staffing_level: 2
      autonomous_maintenance_level: 1
    expected_oee: 0.65  # ~65% OEE
    
  optimized:
    description: "Best practices implementation"
    controls:
      changeover_reduction_level: 2
      operator_training_hours: 30
      line_speed_setting: 82
      sensor_calibration_frequency: 5
      product_sequencing_strategy: "campaign_mode"
      pm_schedule_compliance: 95
      staffing_level: 3
      autonomous_maintenance_level: 2
    expected_oee: 0.75  # ~75% OEE
    
  world_class:
    description: "World-class manufacturing"
    controls:
      changeover_reduction_level: 2
      operator_training_hours: 40
      line_speed_setting: 80
      sensor_calibration_frequency: 3
      product_sequencing_strategy: "campaign_mode"
      pm_schedule_compliance: 100
      staffing_level: 4
      autonomous_maintenance_level: 3
    expected_oee: 0.85  # ~85% OEE

# ====================================================================================
# EXPERIMENT SETTINGS - For LLM discovery
# ====================================================================================
experiments:
  # Defines how the LLM should explore the control space
  exploration_strategy:
    method: "grid_search"  # grid_search, random_search, bayesian_optimization
    resolution: 5  # Number of steps per continuous control
    
  # Control ranges for experimentation
  # Can be different from operational bounds for safety
  experimental_bounds:
    line_speed_setting: [70, 95]  # Wider range for testing
    sensor_calibration_frequency: [1, 21]  # Test extreme cases
    
  # Metrics to optimize
  optimization_targets:
    primary: "oee"
    secondary: ["availability", "performance", "quality"]
    constraints:
      - "scrap_rate < 0.10"  # Quality constraint
      - "mtbf > 60"  # Reliability constraint
      
  # Experiment tracking
  tracking:
    save_results: true
    results_path: "experiments/"
    include_timestamps: true
    track_convergence: true

# ====================================================================================
# FAILURE DISTRIBUTIONS - Realistic failure modeling based on research
# ====================================================================================
failure_distributions:
  # Based on research findings:
  # - 80% of stops are micro-stops (jams, sensor trips, adjustments)
  # - 15% are minor failures (component issues, calibration)
  # - 5% are major failures (equipment breakdown)
  
  micro_stops:
    percentage: 0.80  # 80% of all stops
    causes:
      jam_at_handoff:
        weight: 0.40  # 40% of micro-stops
        duration_mean: 1.0  # 1 minute average
        duration_sigma: 0.3
        description: "Material jams at equipment handoffs"
      sensor_trip:
        weight: 0.25  # 25% of micro-stops
        duration_mean: 0.5  # 30 seconds average
        duration_sigma: 0.2
        description: "False sensor triggers requiring reset"
      minor_adjustment:
        weight: 0.15  # 15% of micro-stops
        duration_mean: 2.0  # 2 minutes average
        duration_sigma: 0.5
        description: "Small equipment adjustments"
      material_issue:
        weight: 0.20  # 20% of micro-stops
        duration_mean: 1.5  # 1.5 minutes average
        duration_sigma: 0.4
        description: "Material quality or feed issues"
    
    # Time between micro-stops (when running)
    occurrence:
      distribution: "exponential"
      base_rate: 20.0  # Average 1 micro-stop per 20 minutes at base
      affected_by:
        - line_speed_setting  # Higher speed = more micro-stops
        - sensor_calibration_frequency  # Poor calibration = more stops
        - operator_training_hours  # Better training = fewer stops
        
  minor_failures:
    percentage: 0.15  # 15% of all stops
    causes:
      component_wear:
        weight: 0.40
        duration_mean: 15.0  # 15 minutes average
        duration_sigma: 5.0
        description: "Component wear requiring adjustment"
      calibration_drift:
        weight: 0.30
        duration_mean: 10.0  # 10 minutes average
        duration_sigma: 3.0
        description: "Equipment out of calibration"
      material_defect:
        weight: 0.30
        duration_mean: 20.0  # 20 minutes average
        duration_sigma: 7.0
        description: "Material defects causing problems"
    
    occurrence:
      distribution: "weibull"
      shape: 2.0  # Wear-out characteristic
      scale: 480.0  # Base scale in minutes
      affected_by:
        - pm_schedule_compliance  # Better PM = fewer failures
        - autonomous_maintenance_level  # Better AM = early detection
        
  major_failures:
    percentage: 0.05  # 5% of all stops
    causes:
      mechanical_breakdown:
        weight: 0.50
        duration_mean: 120.0  # 2 hours average
        duration_sigma: 60.0
        description: "Major mechanical failure"
      electrical_failure:
        weight: 0.30
        duration_mean: 90.0  # 1.5 hours average
        duration_sigma: 30.0
        description: "Electrical system failure"
      control_system_failure:
        weight: 0.20
        duration_mean: 60.0  # 1 hour average
        duration_sigma: 20.0
        description: "Control system or software failure"
    
    occurrence:
      distribution: "lognormal"
      mean_log: 7.96  # log(2880) ≈ 7.96 for 48-hour mean
      sigma_log: 1.0
      affected_by:
        - pm_schedule_compliance  # Critical for preventing major failures
        - equipment_wear_rate  # Accumulated wear increases risk

# ====================================================================================
# FAILURE INJECTION - For testing and validation
# ====================================================================================
failure_injection:
  enabled: false  # Set to true for testing
  
  injected_failures:
    - type: "major_failure"
      equipment: "LINE1-FIL"
      time: 1440  # At 24 hours
      duration: 120
      
    - type: "micro_stop_storm"
      equipment: "LINE2-PCK"
      time: 2880  # At 48 hours
      frequency_multiplier: 5.0
      duration: 60

# ====================================================================================
# REPORTING CONFIGURATION
# ====================================================================================
reporting:
  # KPI reporting
  kpi_reports:
    frequency: "shift"  # shift, daily, weekly
    include_trends: true
    include_pareto: true
    
  # State analysis
  state_analysis:
    track_durations: true
    identify_patterns: true
    correlation_analysis: true
    
  # Recommendations
  recommendations:
    enabled: true
    confidence_threshold: 0.7
    max_recommendations: 5
    include_roi_estimate: true

# ====================================================================================
# INTEGRATION SETTINGS
# ====================================================================================
integration:
  # MES data export
  mes_export:
    enabled: true
    format: "csv"  # csv, json, parquet
    include_headers: true
    timestamp_format: "ISO8601"
    
  # Database connection
  database:
    enabled: true
    connection_string: "sqlite:///data/twin_database.db"
    table_prefix: "twin_"
    batch_insert_size: 1000
    
  # API settings
  api:
    enabled: false
    host: "localhost"
    port: 8000
    cors_enabled: true
    rate_limit: 100  # requests per minute

# ====================================================================================
# VALIDATION SETTINGS
# ====================================================================================
validation:
  # Input validation
  validate_inputs: true
  strict_mode: false  # Fail on warnings
  
  # Output validation
  validate_outputs: true
  kpi_bounds:
    oee: [0, 1]
    availability: [0, 1]
    performance: [0, 1.2]  # Can exceed 100% briefly
    quality: [0, 1]
    
  # Sanity checks
  sanity_checks:
    - "No equipment runs >120% of theoretical rate"
    - "Scrap rate never exceeds 50%"
    - "MTBF is always positive"
    - "Queue levels never negative"