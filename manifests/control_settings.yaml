# Control Settings Manifest
# Current control values for the virtual twin simulation
# These values can be modified to explore different operational scenarios

metadata:
  name: "Active Control Settings"
  version: "1.0.0"
  description: "Current values for actionable controls"
  created: "2024-12-20"
  modified: "2024-12-20"
  scenario: "baseline"  # Which scenario these settings represent

# ====================================================================================
# ACTIVE CONTROL VALUES
# ====================================================================================
controls:
  # Changeover Management
  changeover_reduction_level: 0
  # 0 = No SMED (30-60 min changeovers)
  # 1 = Basic SMED (15-30 min)
  # 2 = Advanced SMED (<10 min)
  
  # Operator Training
  operator_training_hours: 8
  # Monthly training hours per operator
  # Industry average: 8-12 hours
  # Best practice: 20-30 hours
  # World class: 30-40 hours
  
  # Production Speed
  line_speed_setting: 90
  # Percentage of theoretical maximum
  # Higher = more output but more issues
  # Sweet spot typically 80-85%
  
  # Sensor Maintenance
  sensor_calibration_frequency: 14
  # Days between calibrations
  # Best practice: 3-7 days
  # Typical: 7-14 days
  # Poor: >14 days
  
  # Production Scheduling
  product_sequencing_strategy: "random"
  # Options: random, changeover_optimized, campaign_mode
  # random = No optimization
  # changeover_optimized = Group similar products
  # campaign_mode = Long runs of same product
  
  # Preventive Maintenance
  pm_schedule_compliance: 60
  # Percentage of PM tasks completed on time
  # World class: >95%
  # Good: 80-95%
  # Poor: <80%
  
  # Staffing
  staffing_level: 2
  # Operators per line per shift
  # Minimum: 1 (no coverage)
  # Standard: 2 (basic coverage)
  # Good: 3 (full coverage)
  # Optimal: 4 (coverage + float)
  
  # Autonomous Maintenance
  autonomous_maintenance_level: 0
  # 0 = None (maintenance dept only)
  # 1 = Basic (clean, inspect)
  # 2 = Intermediate (+ lubricate, adjust)
  # 3 = Advanced (+ minor repairs)

# ====================================================================================
# COMPUTED PARAMETERS - Derived from controls via mappings
# ====================================================================================
computed_parameters:
  # These are calculated by applying control mappings
  # Shown here for visibility/debugging
  
  # Failure rates (from controls)
  micro_stop_probability: 0.3  # base * factors
  minor_failure_probability: 0.0625
  major_failure_probability: 0.01
  
  # Performance (from controls)
  performance_factor: 0.85
  scrap_rate: 0.07  # Higher due to speed and low training
  
  # Maintenance effectiveness
  mtbf: 480  # Low due to poor PM compliance
  mttr: 30
  
  # Changeover impact
  changeover_duration_multiplier: 1.0  # No SMED
  changeover_frequency_multiplier: 1.0  # Random sequencing

# ====================================================================================
# SHIFT-SPECIFIC MODIFIERS
# ====================================================================================
shift_modifiers:
  shift1:  # Day shift (6 AM - 2 PM)
    performance_multiplier: 1.0
    staffing_adjustment: 0
    quality_multiplier: 1.0
    
  shift2:  # Afternoon shift (2 PM - 10 PM)
    performance_multiplier: 0.95
    staffing_adjustment: 0
    quality_multiplier: 0.98
    
  shift3:  # Night shift (10 PM - 6 AM)
    performance_multiplier: 0.90
    staffing_adjustment: -1  # One less operator
    quality_multiplier: 0.95

# ====================================================================================
# PRODUCT-SPECIFIC ADJUSTMENTS
# ====================================================================================
product_adjustments:
  # Difficulty factors by product
  SKU-1001:
    complexity_factor: 1.0  # Baseline product
    changeover_time: 1.0
    quality_sensitivity: 1.0
    
  SKU-2001:
    complexity_factor: 1.2  # More difficult
    changeover_time: 1.3
    quality_sensitivity: 1.5
    
  SKU-3001:
    complexity_factor: 0.8  # Easier product
    changeover_time: 0.9
    quality_sensitivity: 0.7

# ====================================================================================
# EXPECTED OUTCOMES - For validation
# ====================================================================================
expected_outcomes:
  # With these baseline settings
  oee_range: [0.50, 0.60]  # 50-60% OEE expected
  availability_range: [0.55, 0.65]
  performance_range: [0.75, 0.85]
  quality_range: [0.90, 0.95]
  
  # Key issues expected
  primary_losses:
    - "Micro-stops from poor sensor calibration"
    - "Extended changeovers without SMED"
    - "Quality issues from high speed + low training"
    - "Unplanned downtime from poor PM"
    
  # Improvement opportunities
  quick_wins:
    - "Implement basic SMED (10% OEE gain)"
    - "Increase training to 16 hrs (5% OEE gain)"
    - "Reduce speed to 85% (3% quality gain)"
    - "Weekly sensor calibration (5% availability gain)"

# ====================================================================================
# NOTES AND WARNINGS
# ====================================================================================
notes:
  - "This represents a typical underperforming line"
  - "Multiple improvement opportunities available"
  - "Focus on low-cost/high-impact changes first"
  
warnings:
  - "Speed at 90% causing quality issues"
  - "PM compliance below critical threshold"
  - "No autonomous maintenance increasing micro-stops"
  - "Random sequencing wasting time on changeovers"