# Scheduler Manifest
# Purpose: Configuration for production scheduler
metadata:
  name: "Scheduler Configuration"
  version: "1.0.0"
  description: "Production scheduler configuration for virtual twin"
  created: "2025-08-27"

# Scheduler entity
SCHEDULER-1:
  type: "scheduler"
  name: "Production Scheduler"
  description: "Main production scheduler for all lines"
  properties:
    sequencing_strategy: "changeover_optimized"  # Options: random, changeover_optimized, campaign_mode
    campaign_size: 100
    lookahead_horizon: 480  # Minutes
    scheduling_interval: 5  # Check every 5 minutes
    
    # Product definitions for scheduling
    products:
      SKU-1001:
        family: "Beverages"
        volume_rank: 1
        margin: 0.35
        complexity: 0.3
        typical_batch: 100
        min_batch: 50
        max_batch: 500
      SKU-1002:
        family: "Beverages"
        volume_rank: 2
        margin: 1.15
        complexity: 0.4
        typical_batch: 90
        min_batch: 45
        max_batch: 450
      SKU-2001:
        family: "Juices"
        volume_rank: 3
        margin: 1.50
        complexity: 0.5
        typical_batch: 70
        min_batch: 35
        max_batch: 350
      SKU-2002:
        family: "Juices"
        volume_rank: 4
        margin: 2.75
        complexity: 0.6
        typical_batch: 50
        min_batch: 25
        max_batch: 250
      SKU-3001:
        family: "Kids"
        volume_rank: 5
        margin: 0.25
        complexity: 0.4
        typical_batch: 120
        min_batch: 60
        max_batch: 600
      SKU-3002:
        family: "Sports"
        volume_rank: 6
        margin: 0.60
        complexity: 0.45
        typical_batch: 96
        min_batch: 48
        max_batch: 480
        
    # Shift configuration
    shifts:
      1:
        start: 0
        duration: 480
        efficiency: 1.0
      2:
        start: 480
        duration: 480
        efficiency: 0.95
      3:
        start: 960
        duration: 480
        efficiency: 0.9