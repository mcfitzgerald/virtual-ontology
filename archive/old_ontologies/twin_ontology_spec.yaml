# Virtual Twin Ontology - Lean Extension Layer
# Version: 2.0
# Purpose: Extends MES ontology with virtual twin simulation and sensors
# Focus: Only sensors/properties that exist in actual MES data

# ====================================================================================
# ONTOLOGY METADATA
# ====================================================================================
ontology:
  name: "Virtual Twin Manufacturing Ontology"
  version: "2.0"
  namespace: "twin"
  description: "Virtual twin layer for simulation, optimization, and what-if analysis"
  
  # Imports base MES ontology - we extend, not replace
  related_ontologies:
    - namespace: "mes"
      description: "Base MES ontology with equipment, products, and events"
      shared_concepts: ["Equipment", "ProductionLine", "Product", "DowntimeEvent"]
      import_path: "./ontology_spec.yaml"
    
  # Business context
  domain: "manufacturing_simulation"
  owner: "Virtual Twin Team"
  created: "2025-01-09"
  modified: "2025-01-10"

# ====================================================================================
# CLASSES (Virtual Twin Entities)
# ====================================================================================
classes:
  # Virtual Sensors - observe derived metrics from MES data
  VirtualSensor:
    description: "Virtual sensor that observes metrics derived from MES data"
    maps_to:
      mes: "Equipment"  # Sensors attached to equipment
    
    subclasses:
      PowerMeterSensor:
        description: "Virtual power meter that derives energy consumption from production patterns"
        conditions:
          - field: "observable_property"
            operator: "equals"
            value: "power_consumption"
        derives_from: "machine_status, performance_score, equipment_type, product_id"
        unit: "kWh"
      
      ThroughputSensor:
        description: "Observes production rate vs target to identify efficiency"
        conditions:
          - field: "observable_property"
            operator: "equals"
            value: "throughput_efficiency"
        derives_from: "good_units_produced / target_rate_units_per_5min"
        unit: "ratio"
            
      DefectRateSensor:
        description: "Observes quality through scrap patterns"
        conditions:
          - field: "observable_property"
            operator: "equals"
            value: "defect_rate"
        derives_from: "scrap_units_produced / total_units_produced"
        unit: "ratio"
            
      BottleneckDetector:
        description: "Identifies production bottlenecks from OEE patterns"
        conditions:
          - field: "observable_property"
            operator: "equals"
            value: "bottleneck_indicator"
        derives_from: "OEE analysis across equipment in time windows"
        unit: "boolean"
            
      LineCouplingMonitor:
        description: "Monitors equipment coupling and cascade effects"
        conditions:
          - field: "observable_property"
            operator: "equals"
            value: "line_coupling_strength"
        derives_from: "Correlated downtime patterns across equipment"
        unit: "ratio"
        
      DowntimePatternSensor:
        description: "Analyzes downtime patterns and trends"
        conditions:
          - field: "observable_property"
            operator: "equals"
            value: "downtime_frequency"
        derives_from: "Rolling window analysis of machine_status"
        unit: "ratio"
  
  # Simulation Entities
  SimulationRun:
    description: "Execution of a virtual twin simulation with specific parameters"
    maps_to:
      mes: "ProductionRun"  # Similar to actual production runs
    conditions:
      - field: "run_type"
        operator: "in"
        value: ["baseline", "simulation", "optimization"]
        
  TwinState:
    description: "Current state of the virtual twin including parameters and KPIs"
    maps_to:
      mes: "SystemState"
      
  ActionableParameter:
    description: "Tunable parameter that can be adjusted in simulations"
    subclasses:
      MicroStopParameter:
        description: "Probability of brief equipment stops"
      PerformanceParameter:
        description: "Equipment speed/efficiency multiplier"
      ScrapParameter:
        description: "Quality/scrap rate adjustment"
      MaterialReliabilityParameter:
        description: "Supply chain reliability factor"
      CascadeSensitivityParameter:
        description: "Downstream impact propagation strength"

# ====================================================================================
# RELATIONSHIPS (How twin entities connect)
# ====================================================================================
relationships:
  observes:
    from: "VirtualSensor"
    to: "Equipment"
    description: "Virtual sensor observes equipment metrics"
    type: "many-to-one"
    sql_hint: "sensor.equipment_id = equipment.equipment_id"
    
  simulatesEquipment:
    from: "SimulationRun"
    to: "Equipment"
    description: "Simulation run models equipment behavior"
    type: "many-to-many"
    sql_hint: "simulation_data.run_id = twin_runs.run_id AND simulation_data.equipment_id = equipment.equipment_id"
    
  hasParentRun:
    from: "SimulationRun"
    to: "SimulationRun"
    description: "Simulation lineage tracking (parent-child runs)"
    type: "many-to-one"
    sql_hint: "child.parent_run_id = parent.run_id"
    inverse: "hasChildRuns"
    
  usesParameters:
    from: "SimulationRun"
    to: "ActionableParameter"
    description: "Simulation uses specific parameter configuration"
    type: "many-to-many"
    sql_hint: "parameter_history.run_id = twin_runs.run_id"
    
  synchronizedWith:
    from: "TwinState"
    to: "Equipment"
    description: "Twin state synchronized with equipment state"
    type: "one-to-many"
    sql_hint: "twin_state.equipment_id = equipment.equipment_id"

# ====================================================================================
# PROPERTIES (Twin data attributes)
# ====================================================================================
properties:
  # Virtual Sensor Observations (derived from MES data)
  power_consumption:
    class: "PowerMeterSensor"
    type: "float"
    description: "Energy consumption derived from equipment status and performance"
    sql_column: "value"
    sql_table: "sensor_data"
    observable_property: "power_consumption"
    unit: "kWh"
    business_name: "Derived Energy Usage"
    derives_from: "machine_status, performance_score, equipment_type, product_id"
    examples: [15.5, 12.3, 18.7]
    
  throughput_efficiency:
    class: "ThroughputSensor"
    type: "float"
    description: "Actual vs target production rate"
    sql_column: "value"
    sql_table: "sensor_data"
    observable_property: "throughput_efficiency"
    unit: "ratio"
    business_name: "Throughput Efficiency"
    derives_from: "good_units_produced / target_rate_units_per_5min"
    examples: [0.95, 1.02, 0.88]
    
  defect_rate:
    class: "DefectRateSensor"
    type: "float"
    description: "Defect rate observed from scrap patterns"
    sql_column: "value"
    sql_table: "sensor_data"
    observable_property: "defect_rate"
    unit: "ratio"
    business_name: "Defect Rate"
    derives_from: "scrap_units_produced / total_units"
    validation:
      min: 0
      max: 1
    
  bottleneck_indicator:
    class: "BottleneckDetector"
    type: "float"
    description: "Bottleneck detection indicator (1.0 = is bottleneck)"
    sql_column: "value"
    sql_table: "sensor_data"
    observable_property: "bottleneck_indicator"
    unit: "boolean"
    business_name: "Bottleneck Indicator"
    derives_from: "OEE analysis across equipment"
    
  line_coupling_strength:
    class: "LineCouplingMonitor"
    type: "float"
    description: "Equipment coupling and cascade effect strength"
    sql_column: "value"
    sql_table: "sensor_data"
    observable_property: "line_coupling_strength"
    unit: "ratio"
    business_name: "Line Coupling Strength"
    derives_from: "Correlated downtime patterns"
    
  downtime_frequency:
    class: "DowntimePatternSensor"
    type: "float"
    description: "Frequency of downtime events in rolling window"
    sql_column: "value"
    sql_table: "mes_data"
    unit: "percent"
    validation:
      min: 0
      max: 100
    
  oeeScore:
    class: "OEESensor"
    type: "float"
    description: "Overall Equipment Effectiveness (Availability × Performance × Quality)"
    sql_column: "oee_score"
    sql_table: "mes_data"
    unit: "percent"
    business_name: "OEE"
    
  # Simulation Properties
  runId:
    class: "SimulationRun"
    type: "string"
    description: "Unique identifier for simulation run"
    sql_column: "run_id"
    sql_table: "twin_runs"
    required: true
    unique: true
    examples: ["baseline-2025-01-10-001", "sim-opt-2025-01-10-042"]
    
  runType:
    class: "SimulationRun"
    type: "string"
    description: "Type of simulation run"
    sql_column: "run_type"
    sql_table: "twin_runs"
    validation:
      values: ["baseline", "simulation", "optimization"]
    
  parentRunId:
    class: "SimulationRun"
    type: "string"
    description: "Parent run for lineage tracking"
    sql_column: "parent_run_id"
    sql_table: "twin_runs"
    
  configDelta:
    class: "SimulationRun"
    type: "string"
    description: "JSON of parameter changes from baseline"
    sql_column: "config_delta_json"
    sql_table: "twin_runs"
    
  kpiSummary:
    class: "SimulationRun"
    type: "string"
    description: "JSON summary of KPI results"
    sql_column: "kpi_summary_json"
    sql_table: "twin_runs"
    
  # Actionable Parameters (the 5 scaling levers we control)
  # All parameters are multipliers where 1.0 = baseline production
  maintenanceEffectiveness:
    class: "MaintenanceParameter"
    type: "float"
    description: "Maintenance quality multiplier - scales equipment reliability (1.0 = baseline)"
    sql_column: "micro_stop_probability"  # Keep old column name for compatibility
    sql_table: "parameter_history"
    unit: "multiplier"
    validation:
      min: 0.3   # Can improve to 30% of baseline issues
      max: 1.5   # Can degrade to 150% of baseline issues
    business_name: "Maintenance Effectiveness"
    interpretation: "Scales all micro-stop and jam probabilities"
    
  operationalExcellence:
    class: "PerformanceParameter"
    type: "float"
    description: "Overall operational efficiency multiplier (1.0 = baseline)"
    sql_column: "performance_factor"  # Keep old column name for compatibility
    sql_table: "parameter_history"
    validation:
      min: 0.7   # Can degrade to 70% of baseline
      max: 1.3   # Can improve to 130% of baseline
    business_name: "Operational Excellence"
    interpretation: "Scales equipment efficiency and shift performance"
    
  qualityControlEffectiveness:
    class: "QualityParameter"
    type: "float"
    description: "Quality control effectiveness - scales scrap rates (1.0 = baseline)"
    sql_column: "scrap_multiplier"  # Keep old column name for compatibility
    sql_table: "parameter_history"
    validation:
      min: 0.5   # Can improve to 50% of baseline scrap
      max: 1.5   # Can degrade to 150% of baseline scrap
    business_name: "Quality Control Effectiveness"
    interpretation: "Scales product scrap rates"
    
  supplyChainReliability:
    class: "MaterialReliabilityParameter"
    type: "float"
    description: "Material supply reliability multiplier (1.0 = baseline)"
    sql_column: "material_reliability"  # Keep old column name for compatibility
    sql_table: "parameter_history"
    validation:
      min: 0.5   # Can degrade to 50% reliability
      max: 1.2   # Can improve to 120% reliability
    business_name: "Supply Chain Reliability"
    interpretation: "Inversely scales material starvation probability"
    
  lineDecouplingFactor:
    class: "CascadeSensitivityParameter"
    type: "float"
    description: "Equipment isolation effectiveness (1.0 = baseline coupling)"
    sql_column: "cascade_sensitivity"  # Keep old column name for compatibility
    sql_table: "parameter_history"
    validation:
      min: 0.5   # Better decoupling (50% of baseline cascade)
      max: 2.0   # Worse coupling (200% of baseline cascade)
    business_name: "Line Decoupling Factor"
    interpretation: "Scales downstream impact of upstream failures"
    
  # Synchronization Properties
  syncHealth:
    class: "TwinState"
    type: "string"
    description: "Health of synchronization between physical and virtual"
    sql_column: "sync_status_json"
    sql_table: "twin_state"
    validation:
      values: ["HEALTHY", "DELAYED", "STALE", "UNKNOWN"]
    
  lastSync:
    class: "TwinState"
    type: "datetime"
    description: "Last successful synchronization timestamp"
    sql_column: "timestamp"
    sql_table: "twin_state"
    required: true

# ====================================================================================
# BUSINESS RULES (Twin-specific logic)
# ====================================================================================
business_rules:
  Power_Calculation:
    description: "Energy consumption based on runtime, equipment type, and performance"
    when:
      class: "Equipment"
      condition: "Status is Running or Idle"
    implies: "Energy = base_kw × performance_factor × time_hours"
    sql_hint: |
      CASE 
        WHEN machine_status = 'Running' THEN 
          15.0 * (performance_score/100.0) * 0.083  -- 5 min = 0.083 hours
        WHEN machine_status = 'Idle' THEN 
          1.5 * 0.083
        ELSE 0
      END
      
  OEE_Calculation:
    description: "Overall Equipment Effectiveness calculation"
    when:
      class: "Equipment"
      condition: "Has availability, performance, and quality scores"
    implies: "OEE = Availability × Performance × Quality / 1000000"
    sql_hint: "availability_score * performance_score * quality_score / 1000000.0"
    
  Cascade_Impact:
    description: "Upstream failures impact downstream equipment"
    when:
      class: "Equipment"
      condition: "Upstream equipment has downtime"
    implies: "Downstream performance degraded by cascade_sensitivity factor"
    sql_hint: |
      downstream_performance = upstream_performance * (1 - cascade_sensitivity * upstream_downtime_ratio)
      
  Sync_Health_Status:
    description: "Determine synchronization health based on last update"
    when:
      class: "TwinState"
      condition: "Has last_sync timestamp"
    implies: |
      IF (now - last_sync) <= 5 minutes THEN 'HEALTHY'
      ELIF (now - last_sync) <= 10 minutes THEN 'DELAYED'
      ELSE 'STALE'
    sql_hint: |
      CASE 
        WHEN (julianday('now') - julianday(timestamp)) * 24 * 60 <= 5 THEN 'HEALTHY'
        WHEN (julianday('now') - julianday(timestamp)) * 24 * 60 <= 10 THEN 'DELAYED'
        ELSE 'STALE'
      END
      
  Parameter_Impact_Mapping:
    description: "How scaling parameters affect KPIs (all relative to baseline)"
    when:
      class: "ActionableParameter"
      condition: "Parameter value changed from 1.0 (baseline)"
    implies: |
      maintenanceEffectiveness < 1.0 → improves availability_score (fewer stops)
      maintenanceEffectiveness > 1.0 → degrades availability_score (more stops)
      operationalExcellence > 1.0 → improves performance_score
      operationalExcellence < 1.0 → degrades performance_score
      qualityControlEffectiveness < 1.0 → improves quality_score (less scrap)
      qualityControlEffectiveness > 1.0 → degrades quality_score (more scrap)
      supplyChainReliability > 1.0 → reduces material-related downtime
      supplyChainReliability < 1.0 → increases material-related downtime
      lineDecouplingFactor < 1.0 → reduces cascade effects (better isolation)
      lineDecouplingFactor > 1.0 → increases cascade effects (worse isolation)


# ====================================================================================
# CROSS-SYSTEM MAPPINGS
# ====================================================================================
system_mappings:
  # How twin concepts map to base MES system
  mes_system:
    type: "MES"
    namespace: "mes"
    
    mappings:
      - our_concept: "VirtualSensor"
        their_concept: "Equipment"
        join_key: "equipment_id"
        notes: "Virtual sensors observe equipment metrics"
        
      - our_concept: "SimulationRun"
        their_concept: "ProductionOrder"
        join_key: "production_order_id"
        notes: "Simulations model production runs"
        
      - our_concept: "TwinState"
        their_concept: "SystemState"
        join_key: "timestamp"
        notes: "Twin state mirrors system state at point in time"
        
  # Potential future integrations
  erp_system:
    type: "ERP"
    namespace: "erp"
    
    mappings:
      - our_concept: "SimulationRun"
        their_concept: "ProductionPlan"
        join_key: "plan_id"
        notes: "Simulations could test production plans before execution"

# ====================================================================================
# GLOSSARY (Twin-specific terminology)
# ====================================================================================
glossary:
  digital_twin:
    definition: "Virtual representation of physical manufacturing system for simulation"
    also_known_as: ["virtual twin", "simulation model", "digital shadow"]
    see_also: ["SimulationRun", "TwinState"]
    
  what_if_scenario:
    definition: "Simulation testing impact of parameter changes without affecting production"
    also_known_as: ["scenario analysis", "sensitivity analysis"]
    see_also: ["SimulationRun", "ActionableParameter"]
    
  pareto_front:
    definition: "Set of optimal solutions when optimizing multiple objectives"
    also_known_as: ["pareto optimal", "non-dominated solutions"]
    see_also: ["OptimizationRun", "multi-objective"]
    
  actionable_parameter:
    definition: "Parameter that can be directly controlled or influenced in real operations"
    also_known_as: ["tunable parameter", "control lever", "decision variable"]
    see_also: ["microStopProbability", "performanceFactor"]
    
  synchronization:
    definition: "Process of keeping virtual twin aligned with physical system state"
    also_known_as: ["sync", "state alignment", "twin update"]
    see_also: ["syncHealth", "lastSync", "TwinState"]