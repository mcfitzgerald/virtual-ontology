# MES Baseline Configuration - YAML Version
# This file contains the baseline configuration for MES data generation
# with actual production values and scaling parameters for the virtual twin

# ====================================================================================
# ONTOLOGY METADATA
# ====================================================================================
ontology:
  iri: "http://mes-ontology.org/factory.owl"
  name: "MES Factory Ontology"
  version: "1.0.0"
  description: "Manufacturing Execution System ontology for bottling plant operations"

# ====================================================================================
# SCALING PARAMETERS (Virtual Twin Interventions)
# ====================================================================================
# These are multipliers applied to baseline values
# 1.0 = no change from baseline (actual production)
# Values > 1.0 increase the metric, < 1.0 decrease it

scaling_parameters:
  maintenance_effectiveness:
    description: "Maintenance quality multiplier - reduces equipment stops"
    default: 1.0
    bounds: [0.3, 1.5]  # Can reduce issues to 30% or increase to 150%
    affects: "micro_stop_probabilities"
    
  operational_excellence:
    description: "Overall operational efficiency multiplier"
    default: 1.0
    bounds: [0.7, 1.3]  # Can vary ±30%
    affects: "equipment_efficiency, shift_performance"
    
  quality_control_effectiveness:
    description: "Quality control and scrap reduction multiplier"
    default: 1.0
    bounds: [0.5, 1.5]  # Can improve quality by 50% or degrade by 50%
    affects: "scrap_rates"
    
  supply_chain_reliability:
    description: "Material supply consistency multiplier"
    default: 1.0
    bounds: [0.5, 1.2]  # Supply can be 50% less reliable to 20% more reliable
    affects: "material_starvation_probability"
    
  line_decoupling_factor:
    description: "Equipment isolation effectiveness (inverse of cascade)"
    default: 1.0
    bounds: [0.5, 2.0]  # Can double isolation or halve it
    affects: "cascade_sensitivity"

# ====================================================================================
# BASELINE VALUES (From Actual Production Data)
# ====================================================================================
# These values represent the actual state of the production system
# They will be scaled by the parameters above during simulation

baseline_values:
  # Micro-stop probabilities (per 5-minute interval)
  micro_stops:
    LINE2_PCK_jam:
      probability_per_5min: 0.35  # Highest frequency issue in production
      downtime_reason: "UNP-JAM"
      duration_range_minutes:
        min: 0.5
        max: 2.0
        
    LINE1_FIL_sensor:
      probability_per_5min: 0.20
      downtime_reason: "UNP-SENS"
      duration_range_minutes:
        min: 0.5
        max: 1.5
        
    LINE1_PCK_jam:
      probability_per_5min: 0.15
      downtime_reason: "UNP-JAM"
      duration_range_minutes:
        min: 0.5
        max: 1.5
        
    LINE2_FIL_jam:
      probability_per_5min: 0.10
      downtime_reason: "UNP-JAM"
      duration_range_minutes:
        min: 0.5
        max: 1.5
        
    LINE3_FIL_jam:
      probability_per_5min: 0.08
      downtime_reason: "UNP-JAM"
      duration_range_minutes:
        min: 0.5
        max: 1.0
        
    LINE2_PAL_electrical:
      probability_per_5min: 0.08
      downtime_reason: "UNP-ELEC"
      duration_range_minutes:
        min: 5
        max: 20
        
    LINE3_FIL_sensor:
      probability_per_5min: 0.06
      downtime_reason: "UNP-SENS"
      duration_range_minutes:
        min: 0.5
        max: 2.0
        
    LINE3_PAL_jam:
      probability_per_5min: 0.06
      downtime_reason: "UNP-JAM"
      duration_range_minutes:
        min: 1
        max: 3
        
    LINE1_PAL_jam:
      probability_per_5min: 0.05
      downtime_reason: "UNP-JAM"
      duration_range_minutes:
        min: 1
        max: 3
        
    LINE3_PCK_quality:
      probability_per_5min: 0.05
      downtime_reason: "UNP-QC"
      duration_range_minutes:
        min: 10
        max: 30

  # Equipment efficiency ranges (baseline)
  equipment_efficiency:
    Filler:
      min: 0.75
      max: 0.92
    Packer:
      min: 0.70
      max: 0.90
    Palletizer:
      min: 0.80
      max: 0.95

  # Shift performance variations (baseline)
  shift_performance:
    shift1:  # Day shift
      min: 0.90
      max: 1.00
    shift2:  # Evening shift
      min: 0.85
      max: 0.95
    shift3:  # Night shift
      min: 0.75
      max: 0.90

  # Scrap rates by product (baseline)
  scrap_rates:
    normal:
      SKU-1001: 0.02   # 12oz Sparkling Water
      SKU-1002: 0.025  # 32oz Premium Juice
      SKU-2001: 0.015  # 12oz Soda
      SKU-2002: 0.02   # 16oz Energy Drink
      SKU-3001: 0.018  # 8oz Kids Drink
    startup:
      SKU-1001: 0.05
      SKU-1002: 0.06
      SKU-2001: 0.04
      SKU-2002: 0.07
      SKU-3001: 0.045

  # Material starvation patterns (baseline)
  material_starvation:
    LINE3_PCK:
      hour_range: [10, 12]
      probability_per_5min: 0.20
      downtime_reason: "UNP-MAT"
      duration_range_minutes:
        min: 15
        max: 45
    LINE2_FIL:
      hour_range: [15, 17]
      probability_per_5min: 0.15
      downtime_reason: "UNP-MAT"
      duration_range_minutes:
        min: 10
        max: 30

  # Cascade failure sensitivity (baseline)
  cascade_failures:
    downstream_stop_probability: 0.30  # 30% chance of cascade
    cascade_delay_minutes: 5
    # Equipment flow sequences for proper cascade modeling
    equipment_flows:
      LINE1: ["LINE1-FIL", "LINE1-PCK", "LINE1-PAL"]
      LINE2: ["LINE2-FIL", "LINE2-PCK", "LINE2-PAL"]
      LINE3: ["LINE3-FIL", "LINE3-PCK", "LINE3-PAL"]

  # Performance degradation (baseline)
  performance_drops:
    probability_per_5min: 0.05
    degradation_factor:
      min: 0.60
      max: 0.80

# ====================================================================================
# EQUIPMENT CONFIGURATION
# ====================================================================================
equipment_configuration:
  lines:
    LINE1:
      name: "Production Line 1"
      equipment_sequence:
        - {id: "LINE1-FIL", type: "Filler", position: 1}
        - {id: "LINE1-PCK", type: "Packer", position: 2}
        - {id: "LINE1-PAL", type: "Palletizer", position: 3}
      process_flow:
        LINE1-FIL: {upstream: null, downstream: "LINE1-PCK"}
        LINE1-PCK: {upstream: "LINE1-FIL", downstream: "LINE1-PAL"}
        LINE1-PAL: {upstream: "LINE1-PCK", downstream: null}
        
    LINE2:
      name: "Production Line 2"
      equipment_sequence:
        - {id: "LINE2-FIL", type: "Filler", position: 1}
        - {id: "LINE2-PCK", type: "Packer", position: 2}
        - {id: "LINE2-PAL", type: "Palletizer", position: 3}
      process_flow:
        LINE2-FIL: {upstream: null, downstream: "LINE2-PCK"}
        LINE2-PCK: {upstream: "LINE2-FIL", downstream: "LINE2-PAL"}
        LINE2-PAL: {upstream: "LINE2-PCK", downstream: null}
        
    LINE3:
      name: "Production Line 3"
      equipment_sequence:
        - {id: "LINE3-FIL", type: "Filler", position: 1}
        - {id: "LINE3-PCK", type: "Packer", position: 2}
        - {id: "LINE3-PAL", type: "Palletizer", position: 3}
      process_flow:
        LINE3-FIL: {upstream: null, downstream: "LINE3-PCK"}
        LINE3-PCK: {upstream: "LINE3-FIL", downstream: "LINE3-PAL"}
        LINE3-PAL: {upstream: "LINE3-PCK", downstream: null}

# ====================================================================================
# PRODUCT MASTER DATA
# ====================================================================================
product_master:
  SKU-1001:
    name: "12oz Sparkling Water"
    target_rate_units_per_5min: 500
    standard_cost_per_unit: 0.15
    sale_price_per_unit: 0.50
    
  SKU-1002:
    name: "32oz Premium Juice"
    target_rate_units_per_5min: 350
    standard_cost_per_unit: 0.45
    sale_price_per_unit: 1.50
    quality_issue_scrap_rate: 0.08
    
  SKU-2001:
    name: "12oz Soda"
    target_rate_units_per_5min: 475
    standard_cost_per_unit: 0.20
    sale_price_per_unit: 0.65
    
  SKU-2002:
    name: "16oz Energy Drink"
    target_rate_units_per_5min: 450
    standard_cost_per_unit: 0.55
    sale_price_per_unit: 1.75
    performance_issue_lines: ["LINE1", "LINE3"]
    performance_degradation:
      min: 0.65
      max: 0.80
      
  SKU-3001:
    name: "8oz Kids Drink"
    target_rate_units_per_5min: 550
    standard_cost_per_unit: 0.25
    sale_price_per_unit: 0.75

# ====================================================================================
# DOWNTIME REASON MAPPING
# ====================================================================================
downtime_reason_mapping:
  PLN-CO:
    class: "PlannedChangeover"
    category: "PlannedDowntime"
    description: "Planned product changeover"
    
  PLN-PM:
    class: "PreventiveMaintenance"
    category: "PlannedDowntime"
    description: "Scheduled preventive maintenance"
    
  PLN-CLN:
    class: "PlannedCleaning"
    category: "PlannedDowntime"
    description: "Scheduled cleaning cycle"
    
  UNP-MECH:
    class: "MechanicalFailure"
    category: "UnplannedDowntime"
    description: "Mechanical failure or breakdown"
    
  UNP-JAM:
    class: "MaterialJam"
    category: "UnplannedDowntime"
    description: "Product or material jam"
    
  UNP-ELEC:
    class: "ElectricalFailure"
    category: "UnplannedDowntime"
    description: "Electrical or control system failure"
    
  UNP-MAT:
    class: "MaterialShortage"
    category: "UnplannedDowntime"
    description: "Material shortage or starvation"
    
  UNP-QC:
    class: "QualityIssue"
    category: "UnplannedDowntime"
    description: "Quality control intervention"
    
  UNP-OPR:
    class: "OperatorError"
    category: "UnplannedDowntime"
    description: "Operator error or absence"
    
  UNP-SENS:
    class: "SensorFailure"
    category: "UnplannedDowntime"
    description: "Sensor misalignment or calibration issue"

# ====================================================================================
# PRODUCT SPECIFICATIONS
# ====================================================================================
product_specifications:
  production_window:
    start_hour: 0
    end_hour: 24
    
  shift_schedule:
    shift1: {start: 6, end: 14}   # 6 AM - 2 PM
    shift2: {start: 14, end: 22}  # 2 PM - 10 PM
    shift3: {start: 22, end: 6}   # 10 PM - 6 AM
    
  changeover_duration_minutes:
    default: 30
    by_product_pair:
      SKU-1001_to_SKU-1002: 45
      SKU-1002_to_SKU-1001: 45
      SKU-2001_to_SKU-2002: 20
      SKU-2002_to_SKU-2001: 20
      
  startup_duration_minutes: 15
  
  quality_variation_normal:
    enabled: true
    scrap_rate_multiplier: 1.2
    probability_per_5min: 0.15
    description: "Random quality variations during normal production"
    
  quality_end_of_run:
    enabled: true
    trigger_duration_hours: 4
    scrap_rate_multiplier: 1.5
    description: "Quality degradation during long production runs"
    
  random_performance_drops:
    enabled: true
    probability_per_5min: 0.05
    recovery_time_minutes: 30
    description: "Random performance degradation events"

# ====================================================================================
# SCHEDULED EVENTS
# ====================================================================================
scheduled_events:
  preventive_maintenance:
    - day_of_week: 3  # Wednesday
      hour: 14
      duration_minutes: 120
      equipment_id: "LINE1-FIL"
      downtime_reason: "PLN-PM"
      
    - day_of_week: 5  # Friday
      hour: 6
      duration_minutes: 90
      equipment_id: "LINE2-PCK"
      downtime_reason: "PLN-PM"
      
  cleaning_cycles:
    frequency_hours: 8
    duration_minutes: 30
    downtime_reason: "PLN-CLN"
    description: "Regular cleaning cycles every 8 hours"
    
  major_mechanical_failure:
    enabled: true
    equipment_id: "LINE3-FIL"
    start_datetime: "2025-06-08 02:00:00"
    end_datetime: "2025-06-08 07:30:00"
    downtime_reason: "UNP-MECH"
    description: "Major mechanical failure on Line 3 Filler"

# ====================================================================================
# SPECIAL PATTERNS
# ====================================================================================
special_patterns:
  night_shift_issues:
    enabled: true
    hour_range: [22, 6]
    probability_per_5min: 0.12
    downtime_reason: "UNP-OPR"
    duration_range_minutes:
      min: 5
      max: 15
    description: "Night shift operator issues"
    
  performance_bottleneck:
    enabled: true
    description: "Performance bottleneck for energy drinks on Lines 1 and 3"
    
  changeover_scrap_spike:
    enabled: true
    duration_minutes: 90
    scrap_multiplier: 3.0
    description: "Increased scrap during first 90 minutes of changeovers"