rules:
  - id: hardcoded-number-assignment
    patterns:
      - pattern: $VAR = $NUM
      - metavariable-regex:
          metavariable: $NUM
          regex: '-?\d+\.?\d*'
      - pattern-not: $VAR = 0
      - pattern-not: $VAR = 1
      - pattern-not: $VAR = -1
      - pattern-not: $VAR = 0.0
      - pattern-not: $VAR = 1.0
    languages: [python]
    message: "Hardcoded number $NUM assigned to $VAR"
    severity: INFO
    
  - id: magic-number-in-expression
    patterns:
      - pattern-either:
        - pattern: $X * $NUM
        - pattern: $X / $NUM
        - pattern: $X + $NUM
        - pattern: $X - $NUM
        - pattern: $X % $NUM
        - pattern: $X ** $NUM
        - pattern: $X // $NUM
      - metavariable-regex:
          metavariable: $NUM
          regex: '[2-9]\d+'  # Numbers >= 10, excluding 0,1
    languages: [python]
    message: "Magic number $NUM in expression"
    severity: INFO
    
  - id: hardcoded-array-index
    patterns:
      - pattern: $ARRAY[$INDEX]
      - metavariable-regex:
          metavariable: $INDEX
          regex: '[2-9]\d*'  # Index >= 2
    languages: [python]
    message: "Hardcoded array index $INDEX"
    severity: INFO
    
  - id: hardcoded-range-value
    pattern-either:
      - patterns:
        - pattern: range($NUM)
        - metavariable-regex:
            metavariable: $NUM
            regex: '\d{2,}'  # Numbers with 2+ digits
      - patterns:
        - pattern: range($START, $END, ...)
        - metavariable-regex:
            metavariable: $END
            regex: '\d{2,}'
    languages: [python]
    message: "Hardcoded value in range()"
    severity: INFO
    
  - id: hardcoded-sleep-duration
    patterns:
      - pattern-either:
        - pattern: time.sleep($NUM)
        - pattern: sleep($NUM)
      - metavariable-regex:
          metavariable: $NUM
          regex: '\d+\.?\d*'
    languages: [python]
    message: "Hardcoded sleep duration: $NUM"
    severity: WARNING
    
  - id: hardcoded-timeout
    patterns:
      - pattern: $FUNC(..., timeout=$NUM, ...)
      - metavariable-regex:
          metavariable: $NUM
          regex: '\d+\.?\d*'
    languages: [python]
    message: "Hardcoded timeout value: $NUM"
    severity: WARNING
    
  - id: hardcoded-buffer-size
    patterns:
      - pattern-either:
        - pattern: $FUNC(..., buffer_size=$NUM, ...)
        - pattern: $FUNC(..., batch_size=$NUM, ...)
        - pattern: $FUNC(..., chunk_size=$NUM, ...)
        - pattern: $FUNC(..., max_size=$NUM, ...)
      - metavariable-regex:
          metavariable: $NUM
          regex: '\d{3,}'  # 100+
    languages: [python]
    message: "Hardcoded buffer/batch size: $NUM"
    severity: WARNING