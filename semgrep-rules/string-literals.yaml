rules:
  - id: hardcoded-string-assignment
    pattern-either:
      - pattern: $VAR = "..."
      - pattern: $VAR = '...'
      - pattern: $VAR = f"..."
      - pattern: $VAR = """..."""
      - pattern: $VAR = '''...'''
      - pattern: $VAR = r"..."
      - pattern: $VAR = b"..."
    languages: [python]
    message: "Hardcoded string assigned to $VAR"
    severity: INFO
    
  - id: hardcoded-dict-key
    pattern: {..., "...": $VALUE, ...}
    languages: [python]
    message: "Hardcoded dictionary key"
    severity: INFO
    
  - id: hardcoded-dict-string-value
    pattern: {..., $KEY: "...", ...}
    languages: [python]
    message: "Hardcoded string value in dictionary"
    severity: INFO
    
  - id: hardcoded-string-in-return
    pattern-either:
      - pattern: return "..."
      - pattern: return '...'
      - pattern: return f"..."
    languages: [python]
    message: "Hardcoded string in return statement"
    severity: INFO
    
  - id: hardcoded-string-concatenation
    pattern-either:
      - pattern: $VAR + "..."
      - pattern: "..." + $VAR
      - pattern: $VAR += "..."
    languages: [python]
    message: "Hardcoded string in concatenation"
    severity: INFO
    
  - id: hardcoded-path-string
    pattern-regex: '["\'][/\\]?(?:usr|var|tmp|home|Users|data|logs|config|opt|etc)[/\\][^"\']*["\']'
    languages: [python]
    message: "Hardcoded path string"
    severity: WARNING
    
  - id: hardcoded-file-extension
    pattern-regex: '["\']\S*\.(log|csv|json|yaml|yml|txt|db|sqlite|xml|ini|conf|cfg|pid|lock)["\']'
    languages: [python]
    message: "Hardcoded filename with extension"
    severity: WARNING