[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "twin-model"
version = "1.0.0"
description = "Ontology-driven discrete event simulation framework for manufacturing systems"
authors = ["Virtual Ontology Team"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/virtual-ontology/twin-model"
repository = "https://github.com/virtual-ontology/twin-model.git"
documentation = "https://github.com/virtual-ontology/twin-model/tree/main/docs"
keywords = ["simulation", "manufacturing", "digital-twin", "discrete-event"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [{include = "twin_model"}]

[tool.poetry.dependencies]
python = "^3.9"
simpy = "^4.0"
pydantic = "^2.0"
pyyaml = "^6.0"
numpy = "^1.20"
pandas = "^1.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
mypy = "^1.0"
ruff = "^0.1"
sphinx = "^7.0"
sphinx-rtd-theme = "^2.0"
myst-parser = "^2.0"
types-pyyaml = "^6.0.12.20250822"
lazydocs = "^0.4.8"
sphinx-llms-txt = "^0.5.2"
sphinx-autoapi = "^3.6.0"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/virtual-ontology/twin-model/issues"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.ruff]
target-version = "py38"
line-length = 120
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.isort]
known-first-party = ["twin_model"]