# ============================================================================
# GENERATOR CONFIGURATION
# Data generation parameters for MES simulation
# ============================================================================

# ----------------------------------------------------------------------------
# ONTOLOGY METADATA
# ----------------------------------------------------------------------------
ontology:
  iri: "http://mes-ontology.org/factory.owl"
  name: "MES Factory Ontology"
  version: "1.0.0"
  description: "Manufacturing Execution System ontology for bottling plant operations"

# ----------------------------------------------------------------------------
# EQUIPMENT CONFIGURATION
# Production lines and equipment specifications
# ----------------------------------------------------------------------------
equipment:
  lines:
    LINE1:
      name: "Production Line 1"
      equipment_sequence:
        - {id: "LINE1-FIL", type: "Filler", position: 1}
        - {id: "LINE1-PCK", type: "Packer", position: 2}
        - {id: "LINE1-PAL", type: "Palletizer", position: 3}
    LINE2:
      name: "Production Line 2"
      equipment_sequence:
        - {id: "LINE2-FIL", type: "Filler", position: 1}
        - {id: "LINE2-PCK", type: "Packer", position: 2}
        - {id: "LINE2-PAL", type: "Palletizer", position: 3}
    LINE3:
      name: "Production Line 3"
      equipment_sequence:
        - {id: "LINE3-FIL", type: "Filler", position: 1}
        - {id: "LINE3-PCK", type: "Packer", position: 2}
        - {id: "LINE3-PAL", type: "Palletizer", position: 3}

  # Equipment efficiency multipliers (applied to performance_factor)
  efficiency_multipliers:
    filler:
      min_multiplier: 0.88
      max_multiplier: 1.08
    packer:
      min_multiplier: 0.82
      max_multiplier: 1.06
    palletizer:
      min_multiplier: 0.94
      max_multiplier: 1.12

# ----------------------------------------------------------------------------
# PRODUCT SPECIFICATIONS
# Product master data and quality parameters
# ----------------------------------------------------------------------------
products:
  # Product master data
  master:
    SKU-1001:
      name: "12oz Sparkling Water"
      target_rate_units_per_5min: 500
      standard_cost_per_unit: 0.15
      sale_price_per_unit: 0.50
      normal_scrap_rate: 0.02
      startup_scrap_rate: 0.05
    SKU-1002:
      name: "32oz Premium Juice"
      target_rate_units_per_5min: 350
      standard_cost_per_unit: 0.45
      sale_price_per_unit: 1.50
      normal_scrap_rate: 0.025
      quality_issue_scrap_rate: 0.08
      startup_scrap_rate: 0.06
    SKU-2001:
      name: "12oz Soda"
      target_rate_units_per_5min: 475
      standard_cost_per_unit: 0.20
      sale_price_per_unit: 0.65
      normal_scrap_rate: 0.015
      startup_scrap_rate: 0.04
    SKU-2002:
      name: "16oz Energy Drink"
      target_rate_units_per_5min: 450
      standard_cost_per_unit: 0.55
      sale_price_per_unit: 1.75
      normal_scrap_rate: 0.02
      performance_issue_lines: ["LINE1", "LINE3"]
      performance_degradation: {min: 0.65, max: 0.80}
      startup_scrap_rate: 0.07
    SKU-3001:
      name: "8oz Kids Drink"
      target_rate_units_per_5min: 550
      standard_cost_per_unit: 0.25
      sale_price_per_unit: 0.75
      normal_scrap_rate: 0.018
      startup_scrap_rate: 0.045

  # Scrap rate limits
  scrap_rates:
    normal_scrap_max: 0.15  # 15%
    startup_scrap_max: 0.20  # 20%
    end_of_run_multiplier: 1.5
    changeover_spike_multiplier: 1.5

# ----------------------------------------------------------------------------
# ACTIONABLE PARAMETERS (SCALING APPROACH)
# All parameters are multipliers where 1.0 = baseline (actual production)
# ----------------------------------------------------------------------------
parameters:
  micro_stop_probability:
    description: "Maintenance effectiveness multiplier - scales equipment reliability (1.0 = baseline)"
    bounds:
      min: 0.3   # Can improve to 30% of baseline issues
      max: 1.5   # Can degrade to 150% of baseline issues
    default: 1.0  # Baseline production
    unit: "http://qudt.org/vocab/unit/UNITLESS"
    type: "factor"
    causal_effect: "Scales all micro-stop and jam probabilities"
    invariants: ['value >= 0.3', 'value <= 1.5']
    
  performance_factor:
    description: "Operational excellence multiplier - scales equipment performance (1.0 = baseline)"
    bounds:
      min: 0.7   # Can degrade to 70% of baseline
      max: 1.3   # Can improve to 130% of baseline
    default: 1.0  # Baseline production
    unit: "http://qudt.org/vocab/unit/UNITLESS"
    type: "factor"
    causal_effect: "Scales equipment efficiency and shift performance"
    invariants: ['value >= 0.7', 'value <= 1.3']
    
  scrap_multiplier:
    description: "Quality control effectiveness - scales scrap rates (1.0 = baseline)"
    bounds:
      min: 0.5   # Can improve to 50% of baseline scrap
      max: 1.5   # Can degrade to 150% of baseline scrap
    default: 1.0  # Baseline production
    unit: "http://qudt.org/vocab/unit/UNITLESS"
    type: "factor"
    causal_effect: "Scales product scrap rates"
    invariants: ['value >= 0.5', 'value <= 1.5']
    
  material_reliability:
    description: "Supply chain reliability multiplier (1.0 = baseline)"
    bounds:
      min: 0.5   # Can degrade to 50% reliability
      max: 1.2   # Can improve to 120% reliability
    default: 1.0  # Baseline production
    unit: "http://qudt.org/vocab/unit/UNITLESS"
    type: "factor"
    causal_effect: "Inversely scales material starvation probability"
    invariants: ['value >= 0.5', 'value <= 1.2']
    
  cascade_sensitivity:
    description: "Line decoupling effectiveness - inverse cascade (1.0 = baseline coupling)"
    bounds:
      min: 0.5   # Better decoupling (50% of baseline cascade)
      max: 2.0   # Worse coupling (200% of baseline cascade)
    default: 1.0  # Baseline production
    unit: "http://qudt.org/vocab/unit/UNITLESS"
    type: "factor"
    causal_effect: "Scales downstream impact of upstream failures"
    invariants: ['value >= 0.5', 'value <= 2.0']

# ----------------------------------------------------------------------------
# SHIFT PERFORMANCE
# Shift-specific performance variations
# ----------------------------------------------------------------------------
shift_performance:
  shift1:  # 6am-2pm
    min_multiplier: 0.95
    max_multiplier: 1.05
  shift2:  # 2pm-10pm
    min_multiplier: 0.90
    max_multiplier: 1.00
  shift3:  # 10pm-6am
    min_multiplier: 0.85
    max_multiplier: 0.95

# ----------------------------------------------------------------------------
# ANOMALY PATTERNS
# Micro-stops, jams, and other production issues
# ----------------------------------------------------------------------------
anomalies:
  # Micro-stop patterns (multipliers applied to micro_stop_probability)
  micro_stops:
    minor_stops_line1_multiplier: 0.8
    recurring_jams_line1_multiplier: 0.75
    filler_micro_stops_multiplier: 0.5
    palletizer_micro_stops_multiplier: 0.25

  # Material starvation configuration
  material_starvation:
    starvation_prob_min: 0.01
    starvation_prob_multiplier: 0.5  # Applied to (1 - material_reliability)
  
  # Cascade failure configuration
  cascade_failures:
    cascade_delay_base: 10  # minutes
    cascade_delay_offset: 1  # minutes
    # delay = base * (1 - sensitivity) + offset

  # Performance degradation
  performance_degradation:
    floor: 0.3  # Minimum performance floor
    min_multiplier: 0.70
    max_multiplier: 0.94

  # Random performance drops
  random_performance_drops:
    enabled: true
    probability_per_5min: 0.002
    duration_intervals: {min: 6, max: 24}
    degradation_factor: {min: 0.7, max: 0.9}

# ----------------------------------------------------------------------------
# DOWNTIME REASON CODES
# Standardized downtime categorization
# ----------------------------------------------------------------------------
downtime_reasons:
  PLN-CO:
    description: "Planned Changeover"
    category: "Planned"
  PLN-PM:
    description: "Planned Maintenance"
    category: "Planned"
  UNP-MF:
    description: "Mechanical Failure"
    category: "Unplanned"
  UNP-EF:
    description: "Electrical Failure"
    category: "Unplanned"
  UNP-JAM:
    description: "Product Jam"
    category: "Unplanned"
  UNP-MS:
    description: "Micro Stop"
    category: "Unplanned"
  UNP-MAT:
    description: "Material Shortage"
    category: "Unplanned"
  UNP-QLT:
    description: "Quality Issue"
    category: "Unplanned"
  UNP-OPR:
    description: "Operator Issue"
    category: "Unplanned"
  UNP-SEN:
    description: "Sensor Issue"
    category: "Unplanned"

# ----------------------------------------------------------------------------
# ENERGY CONSUMPTION
# Energy parameters by equipment type and status
# ----------------------------------------------------------------------------
energy:
  base_consumption_kw:
    Filler:
      running: 15.0
      idle: 1.5
    Packer:
      running: 12.0
      idle: 1.2
    Palletizer:
      running: 10.0
      idle: 1.0
  
  performance_impact:
    scaling_factor: 0.8  # Energy doesn't scale linearly with performance
  
  micro_stop_penalty:
    startup_surge_multiplier: 1.5  # Startup surge during micro-stops
  
  product_specific_factors:
    SKU-2002:  # Energy drink requires more energy
      energy_multiplier: 1.2
    SKU-3001:  # Kids drink requires less energy
      energy_multiplier: 0.9

# ----------------------------------------------------------------------------
# PRODUCTION SCHEDULE
# Configuration for production order generation
# ----------------------------------------------------------------------------
production_schedule:
  run_duration_hours:
    min: 8
    max: 24
  changeover_gap_minutes:
    min: 30
    max: 90

# ----------------------------------------------------------------------------
# SCENARIO CONFIGURATIONS
# Pre-configured test scenarios
# ----------------------------------------------------------------------------
scenarios:
  improved_maintenance:
    micro_stop_probability: 0.8  # 20% improvement
    performance_factor: 1.05     # 5% performance boost
    
  better_quality:
    scrap_multiplier: 0.8        # 20% less scrap
    performance_factor: 1.0
    
  optimized_supply:
    material_reliability: 1.15   # 15% better reliability
    cascade_sensitivity: 0.7     # 30% less cascade impact
    
  best_case:
    micro_stop_probability: 0.7
    performance_factor: 1.2
    scrap_multiplier: 0.6
    material_reliability: 1.2
    cascade_sensitivity: 0.5
    
  worst_case:
    micro_stop_probability: 1.4
    performance_factor: 0.75
    scrap_multiplier: 1.4
    material_reliability: 0.6
    cascade_sensitivity: 1.8