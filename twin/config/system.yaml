# ============================================================================
# SYSTEM CONFIGURATION
# Twin module operational settings and parameters
# ============================================================================

# ----------------------------------------------------------------------------
# DATABASE CONFIGURATION
# Primary database and API interface settings
# ----------------------------------------------------------------------------
database:
  path: "data/mes_database.db"
  api_interface: "api.sh"  # Primary interface for database operations
  api_port: 8000
  api_timeout: 30  # seconds
  
# ----------------------------------------------------------------------------
# FILE PATHS
# System-wide file and directory paths
# ----------------------------------------------------------------------------
paths:
  # Generator is now internal to twin module
  generator: "twin/generator.py"
  # Configuration directories
  config_dir: "twin/config"
  export_dir: "data/simulation_configs"
  # Base configuration for generator
  base_config: "twin/config/generator.yaml"
  # Logging and history
  query_logs: "learning_history/query_logs.json"
  api_log: "logs/api.log"

# ----------------------------------------------------------------------------
# MODULE: simulation_runner
# Simulation execution and management settings
# ----------------------------------------------------------------------------
simulation_runner:
  generator_version: "1.2.0"  # Updated for integrated generator
  duration_limits:
    min: 1
    max: 30
  default_start_date: "2025-06-01"
  seed_range:
    min: 0
    max: 10000
  max_workers: 4  # Thread pool size for parallel execution
  confidence_level: 0.95
  validation_runs: 10
  std_dev_multiplier: 0.05  # 5% of base value

# ----------------------------------------------------------------------------
# MODULE: twin_state
# Virtual twin state management and tracking
# ----------------------------------------------------------------------------
twin_state:
  validation:
    n_runs: 10  # Number of validation runs for confidence calculation
    confidence_level: 0.95  # 95% confidence level
    std_dev_multiplier: 0.05  # Standard deviation as fraction of base value
  trends:
    window_size: 5  # Number of runs to analyze for trends
  limits:
    active_recommendations: 5  # Maximum active recommendations to track
  retention:
    state_history_days: 30  # How long to keep state history

# ----------------------------------------------------------------------------
# MODULE: optimization_engine
# scipy-based differential evolution optimization
# ----------------------------------------------------------------------------
optimization_engine:
  algorithm:
    population_size: 10
    generations: 5
    seed: 42
    mutation:
      min: 0.5
      max: 1.0
    recombination: 0.7
    tolerance: 0.01
  monte_carlo:
    n_simulations: 1000
    confidence_level: 0.95
    seed_max: 4294967296  # 2^32

# ----------------------------------------------------------------------------
# MODULE: recommendation_engine
# pymoo-based NSGA-II multi-objective optimization
# ----------------------------------------------------------------------------
recommendation_engine:
  # Default simulation parameters
  simulation_duration_days: 7
  simulation_seed: 42
  
  # NSGA-II algorithm parameters
  optimization:
    population_size: 50
    generations: 100
    seed: 42
  
  # Scenario optimization (lighter weight)
  scenario_optimization:
    population_size: 20
    generations: 50
  
  # Scenario keyword mapping
  scenario_keywords:
    energy:
      keywords: ['energy', 'power', 'consumption']
      objective: {name: 'energy', direction: 'minimize', weight: 1.0}
    throughput:
      keywords: ['throughput', 'production', 'output']
      objective: {name: 'throughput', direction: 'maximize', weight: 1.0}
    quality:
      keywords: ['quality', 'defect', 'scrap']
      objective: {name: 'quality', direction: 'maximize', weight: 1.0}
    oee:
      keywords: ['oee', 'efficiency', 'overall']
      objective: {name: 'oee', direction: 'maximize', weight: 1.0}
    cost:
      keywords: ['cost', 'save', 'expense']
      objective: {name: 'cost', direction: 'minimize', weight: 1.0}
  
  # Default objective if none specified
  default_objective: {name: 'oee', direction: 'maximize', weight: 1.0}
  
  # Base KPI values for calculations
  base_kpis:
    oee: 0.65
    availability: 0.80
    performance: 0.85
    quality: 0.95
    energy_per_day: 1000.0  # kWh
    scrap_rate: 0.05
    production_units: 10000  # per day
  
  # Implementation steps for parameter changes
  implementation_steps:
    micro_stop_probability:
      - {threshold: 0.10, operator: '<', steps: ["Implement preventive maintenance schedule", "Train operators on micro-stop prevention"]}
    performance_factor:
      - {threshold: 0.90, operator: '>', steps: ["Optimize equipment speed settings", "Review and adjust production targets"]}
    scrap_multiplier:
      - {threshold: 1.5, operator: '<', steps: ["Enhance quality control procedures", "Implement inline inspection systems"]}
    material_reliability:
      - {threshold: 0.95, operator: '>', steps: ["Work with suppliers on material quality", "Implement incoming material inspection"]}
    cascade_sensitivity:
      - {threshold: 0.3, operator: '<', steps: ["Increase buffer capacity between equipment", "Implement decoupling strategies"]}
    default_implementation_steps: ["Review and implement parameter adjustments"]
  
  # Risks associated with parameter changes
  risks:
    performance_factor:
      - {threshold: 0.95, operator: '>', risks: ["Equipment wear may increase at higher speeds"]}
    scrap_multiplier:
      - {threshold: 1.2, operator: '<', risks: ["Quality improvements may require capital investment"]}
    cascade_sensitivity:
      - {threshold: 0.2, operator: '<', risks: ["Increased buffer inventory costs"]}
    default_risks: ["No significant risks identified"]
  
  # Impact calculation baselines (for comparison)
  impact_baselines:
    micro_stop_probability: 0.20
    performance_factor: 0.85
    scrap_multiplier: 2.0
    material_reliability: 0.85
    cascade_sensitivity: 0.5
  
  # Impact weights for KPI calculations
  impact_weights:
    availability:
      micro_stop: 0.3
      material: 0.1
    performance:
      performance_factor: 0.4
    quality:
      scrap: 0.2
    energy:
      performance: 0.2
  
  # Cost calculation factors
  cost_factors:
    base_cost: 1000
    energy_cost_per_kwh: 0.15
    scrap_cost_multiplier: 5000
  
  # Approximation fallback values (when not using simulation)
  approximation_defaults:
    micro_stop_probability: 0.15
    performance_factor: 0.85
    scrap_multiplier: 2.0
    material_reliability: 0.85
    cascade_sensitivity: 0.5
    base_availability: 95.0  # Base availability percentage
    base_throughput: 1000  # Base throughput units
    energy_base: 0.5  # Base energy per unit
    energy_cascade_factor: 0.2  # Energy increase per cascade sensitivity

# ----------------------------------------------------------------------------
# MODULE: cost_impact_calculator
# PyMC-based Bayesian financial analysis
# ----------------------------------------------------------------------------
cost_impact:
  # Production costs
  labor_cost_per_hour: 75.0  # USD
  energy_cost_per_kwh: 0.12  # USD
  material_cost_per_unit: 0.50  # USD
  
  # Downtime costs
  downtime_cost_per_hour: 5000.0  # USD
  
  # Quality costs
  scrap_cost_per_unit: 2.00  # USD
  rework_cost_per_unit: 1.50  # USD
  
  # Implementation costs
  parameter_change_cost: 1000.0  # One-time per parameter
  training_cost: 2500.0  # One-time training
  monitoring_cost_per_week: 500.0  # Ongoing
  
  # Financial parameters
  discount_rate: 0.10  # Annual discount rate for NPV
  confidence_level: 0.95  # For credible intervals
  time_horizon_weeks: 52  # Default 1 year
  
  # PyMC sampling parameters
  mcmc:
    draws: 2000
    tune: 1000
    chains: 4
    target_accept: 0.95

# ----------------------------------------------------------------------------
# MODULE: line_coupling_model
# Production line interaction and cascade modeling
# ----------------------------------------------------------------------------
line_coupling:
  # Buffer configuration
  buffer:
    capacity: 100  # units
    initial_level: 50  # units
    min_operating_level: 10  # units
    max_operating_level: 90  # units
  
  # Flow rates
  flow_rates:
    depletion_rate: 10.0  # units/min when upstream stopped
    refill_rate: 20.0  # units/min when upstream running
  
  # Stochastic parameters
  stochastic:
    depletion_noise_std: 2.0  # Standard deviation
    refill_noise_std: 3.0  # Standard deviation
    use_probabilistic: true  # Enable stochastic variation
  
  # Equipment flow definitions
  equipment_flows:
    LINE1: ['LINE1-FIL', 'LINE1-PCK', 'LINE1-PAL']
    LINE2: ['LINE2-FIL', 'LINE2-PCK', 'LINE2-PAL']
    LINE3: ['LINE3-FIL', 'LINE3-PCK', 'LINE3-PAL']

# ----------------------------------------------------------------------------
# MODULE: config_manager
# Configuration storage and management
# ----------------------------------------------------------------------------
config_manager:
  directories:
    config_dir: "twin/configs"
    export_dir: "data/simulation_configs"
  retention:
    config_history_days: 30
    cleanup_interval_days: 7
  limits:
    max_configs_list: 100
    max_config_size_mb: 10

# ----------------------------------------------------------------------------
# MODULE: virtual_sensors
# Virtual sensor configuration and confidence settings
# ----------------------------------------------------------------------------
virtual_sensors:
  # Confidence values for different sensor types (0.0 - 1.0)
  confidence_levels:
    power_consumption: 0.95      # Energy is estimated, not measured
    throughput_efficiency: 1.0   # Direct calculation from data
    defect_rate: 1.0             # Direct calculation from data
    bottleneck_indicator: 0.8    # Statistical inference
    line_coupling_strength: 0.9  # Pattern detection
    downtime_frequency: 1.0      # Direct observation
  
  # Sensor-specific configuration
  power_meter:
    base_power_kwh:
      Filler: 85.0
      Packer: 75.0
      Palletizer: 65.0
    idle_power_kwh:
      Filler: 15.0
      Packer: 12.0
      Palletizer: 10.0
  
  bottleneck_detector:
    window_size: 12  # 1 hour (12 x 5-minute intervals)
    significance_threshold: 0.9  # Must be 90% below average to be bottleneck
  
  line_coupling:
    cascade_threshold: 0.7  # Coupling strength threshold for cascade detection

# ----------------------------------------------------------------------------
# MODULE: sync_health
# Synchronization monitoring and health checks
# ----------------------------------------------------------------------------
sync_health:
  # Sync intervals
  default_sync_interval: 5  # minutes
  alert_threshold: 30  # minutes
  
  # Health status thresholds (multipliers of sync_interval)
  status_thresholds:
    healthy: 1.0  # Within 1x sync_interval
    delayed: 2.0  # Within 2x sync_interval
    # Beyond 2x is considered STALE
  
  # History and retention
  default_history_hours: 24
  sync_log_retention_days: 30

# ----------------------------------------------------------------------------
# VISUALIZATION SETTINGS
# Display limits and visualization parameters
# ----------------------------------------------------------------------------
display:
  limits:
    max_config_list: 100
    max_active_recommendations: 5
    trend_runs: 5
    max_pareto_points: 100
  
  # Plot settings
  plots:
    figure_size: [10, 6]
    dpi: 100
    style: "seaborn"
    
  # Color schemes
  colors:
    primary: "#1f77b4"
    secondary: "#ff7f0e"
    success: "#2ca02c"
    warning: "#ff9800"
    error: "#d62728"

# ----------------------------------------------------------------------------
# SYSTEM-WIDE SETTINGS
# Global system configuration
# ----------------------------------------------------------------------------
system:
  environment: "development"  # Options: development, test, production
  log_level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
  timezone: "UTC"
  
  # Performance settings
  performance:
    cache_enabled: true
    cache_ttl_seconds: 300  # 5 minutes
    max_cache_size_mb: 100
  
  # Error handling
  error_handling:
    max_retries: 3
    retry_delay_seconds: 1
    exponential_backoff: true
  
  # Monitoring
  monitoring:
    metrics_enabled: false
    metrics_port: 9090
    health_check_interval: 60  # seconds