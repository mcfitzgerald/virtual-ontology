# Virtual Twin Configuration Defaults
# This file centralizes all configuration values that were previously hardcoded
# throughout the twin module. Values can be overridden by environment-specific
# configurations (production.yaml, development.yaml, test.yaml)

# Database Configuration
database:
  # Default path to the SQLite database
  path: "data/mes_database.db"
  
# File Paths
paths:
  # Path to the synthetic data generator script
  generator: "synthetic_data_generator/mes_data_generation.py"
  # Default directory for storing configurations
  config_dir: "twin/configs"
  # Default directory for exporting configurations
  export_dir: "data/simulation_configs"
  # Base configuration file for MES data generation
  base_config: "synthetic_data_generator/mes_data_config.json"

# Simulation Settings
simulation:
  # Version identifier for the generator
  generator_version: "1.0.0"
  # Minimum and maximum duration for simulations (days)
  duration_limits:
    min: 1
    max: 30
  # Default start date for simulations
  default_start_date: "2025-06-01"
  # Random seed range for simulations
  seed_range:
    min: 0
    max: 10000
  # Number of threads for parallel execution
  max_workers: 4
  # Default confidence level for statistical calculations
  confidence_level: 0.95
  # Number of validation runs for confidence calculations
  validation_runs: 10
  # Standard deviation multiplier for simulation variation
  std_dev_multiplier: 0.05  # 5% of base value

# Actionable Parameters Configuration - Scaling Approach
# All parameters are multipliers where 1.0 = baseline (actual production)
parameters:
  # Legacy names kept for compatibility, but with scaling interpretation
  micro_stop_probability:
    description: "Maintenance effectiveness multiplier - scales equipment reliability (1.0 = baseline)"
    bounds:
      min: 0.3   # Can improve to 30% of baseline issues
      max: 1.5   # Can degrade to 150% of baseline issues
    default: 1.0  # Baseline production
    unit: "http://qudt.org/vocab/unit/UNITLESS"
    type: "factor"
    causal_effect: "Scales all micro-stop and jam probabilities"
    
  performance_factor:
    description: "Operational excellence multiplier - scales equipment performance (1.0 = baseline)"
    bounds:
      min: 0.7   # Can degrade to 70% of baseline
      max: 1.3   # Can improve to 130% of baseline
    default: 1.0  # Baseline production
    unit: "http://qudt.org/vocab/unit/UNITLESS"
    type: "factor"
    causal_effect: "Scales equipment efficiency and shift performance"
    
  scrap_multiplier:
    description: "Quality control effectiveness - scales scrap rates (1.0 = baseline)"
    bounds:
      min: 0.5   # Can improve to 50% of baseline scrap
      max: 1.5   # Can degrade to 150% of baseline scrap
    default: 1.0  # Baseline production
    unit: "http://qudt.org/vocab/unit/UNITLESS"
    type: "factor"
    causal_effect: "Scales product scrap rates"
    
  material_reliability:
    description: "Supply chain reliability multiplier (1.0 = baseline)"
    bounds:
      min: 0.5   # Can degrade to 50% reliability
      max: 1.2   # Can improve to 120% reliability
    default: 1.0  # Baseline production
    unit: "http://qudt.org/vocab/unit/UNITLESS"
    type: "factor"
    causal_effect: "Inversely scales material starvation probability"
    
  cascade_sensitivity:
    description: "Line decoupling effectiveness - inverse cascade (1.0 = baseline coupling)"
    bounds:
      min: 0.5   # Better decoupling (50% of baseline cascade)
      max: 2.0   # Worse coupling (200% of baseline cascade)
    default: 1.0  # Baseline production
    unit: "http://qudt.org/vocab/unit/UNITLESS"
    type: "factor"
    causal_effect: "Scales downstream impact of upstream failures"

# Equipment Configuration Multipliers
equipment_multipliers:
  # Equipment efficiency multipliers (applied to performance_factor)
  efficiency:
    filler:
      min_multiplier: 0.88
      max_multiplier: 1.08
    packer:
      min_multiplier: 0.82
      max_multiplier: 1.06
    palletizer:
      min_multiplier: 0.94
      max_multiplier: 1.12
  
  # Shift performance variations (applied to performance_factor)
  shift_performance:
    shift1:
      min_multiplier: 0.95
      max_multiplier: 1.05
    shift2:
      min_multiplier: 0.90
      max_multiplier: 1.00
    shift3:
      min_multiplier: 0.85
      max_multiplier: 0.95
  
  # Performance degradation settings
  performance_degradation:
    floor: 0.3  # Minimum performance floor
    min_multiplier: 0.70
    max_multiplier: 0.94

# Micro-Stop Configuration
micro_stops:
  # Multipliers applied to micro_stop_probability for different patterns
  minor_stops_line1_multiplier: 0.8
  recurring_jams_line1_multiplier: 0.75
  filler_micro_stops_multiplier: 0.5
  palletizer_micro_stops_multiplier: 0.25

# Scrap Rate Configuration
scrap_rates:
  # Maximum allowed scrap rates
  normal_scrap_max: 0.15  # 15%
  startup_scrap_max: 0.20  # 20%
  # Multipliers for special conditions
  end_of_run_multiplier: 1.5
  changeover_spike_multiplier: 1.5

# Material & Cascade Configuration
material_cascade:
  # Material starvation probability calculation
  starvation_prob_min: 0.01
  starvation_prob_multiplier: 0.5  # Applied to (1 - material_reliability)
  # Cascade delay calculation: delay = base * (1 - sensitivity) + offset
  cascade_delay_base: 10
  cascade_delay_offset: 1

# Synchronization Health Settings
sync_health:
  # Default sync interval in minutes
  default_sync_interval: 5
  # Alert threshold in minutes
  alert_threshold: 30
  # Health status thresholds (multipliers of sync_interval)
  status_thresholds:
    healthy: 1.0  # Within 1x sync_interval
    delayed: 2.0  # Within 2x sync_interval
    # Beyond 2x is considered STALE

# Data Retention Settings
retention:
  # Number of days to keep configuration history
  config_history_days: 30
  # Number of days to keep sync health logs
  sync_log_days: 30
  # Default hours of history to retrieve
  default_history_hours: 24

# UI/Display Limits
display_limits:
  # Maximum number of configs to list at once
  max_config_list: 100
  # Maximum number of active recommendations to show
  max_active_recommendations: 5
  # Number of runs to show in improvement trends
  trend_runs: 5

# Scenario Configurations
# These define pre-configured scenarios for testing
scenarios:
  improved_maintenance:
    micro_stop_probability: 0.10
    performance_factor: 0.90
    
  better_quality:
    scrap_multiplier: 1.2
    performance_factor: 0.85
    
  optimized_supply:
    material_reliability: 0.95
    cascade_sensitivity: 0.3
    
  best_case:
    micro_stop_probability: 0.08
    performance_factor: 0.95
    scrap_multiplier: 1.1
    material_reliability: 0.98
    cascade_sensitivity: 0.2
    
  worst_case:
    micro_stop_probability: 0.35
    performance_factor: 0.60
    scrap_multiplier: 3.5
    material_reliability: 0.60
    cascade_sensitivity: 0.8

# Line Configuration
lines:
  # Available production lines
  available: ["LINE1", "LINE2", "LINE3"]
  # Default line assignments
  default_assignments:
    - 1
    - 2
    - 3

# Cost Parameters for ROI Calculations
cost_parameters:
  # Production costs
  labor_cost_per_hour: 75.0  # USD per hour
  energy_cost_per_kwh: 0.12  # USD per kWh
  material_cost_per_unit: 0.50  # USD per unit
  
  # Downtime costs
  downtime_cost_per_hour: 5000.0  # USD per hour of downtime
  
  # Quality costs
  scrap_cost_per_unit: 2.00  # USD per scrapped unit
  rework_cost_per_unit: 1.50  # USD per reworked unit
  
  # Implementation costs
  parameter_change_cost: 1000.0  # One-time cost per parameter change
  training_cost: 2500.0  # One-time training cost
  monitoring_cost_per_week: 500.0  # Ongoing monitoring cost
  
  # Financial parameters
  discount_rate: 0.10  # Annual discount rate for NPV
  confidence_level: 0.95  # Confidence level for intervals
  default_time_horizon_weeks: 52  # Default time horizon for ROI calculation (1 year)