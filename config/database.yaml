# Database API Configuration
# REQUIRED - Application will not start without this file

api:
  port: 8000
  host: "0.0.0.0"
  base_url: "http://localhost"
  endpoints:
    root: "/"
    health: "/health"
    swagger_ui: "/docs"
    redoc: "/redoc"

logging:
  level: "info"
  format: "json"
  dir: "logs"
  api_log_file: "twin_api.log"

processing:
  batch_size: 5000
  chunk_size: 10000
  progress_report_interval: 50000
  max_batch_size: 10000
  min_buffer_size: 10
  
database:
  url_template: "sqlite:///{db_path}"
  default_db_name: "twin_database.db"
  data_dir: "data"
  cache_dir: "cache"
  cache_metadata_file: "metadata.json"

# Testing configuration
testing:
  base_seed: 42  # Base seed for test runs (actual seed = base_seed + run_index)