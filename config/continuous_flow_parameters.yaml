# Continuous Flow Optimized Parameters
# Target: Achieve 60-70% OEE with realistic continuous flow
# Created: 2025-09-08

metadata:
  name: "Continuous Flow Parameters"
  version: "2.0.0"
  description: "Optimized parameters for continuous flow simulation"
  created: "2025-09-08"

# Default parameters for all equipment types
defaults:
  # Source defaults for continuous generation
  source:
    generation_rate: 300.0      # High rate for continuous flow (units/min)
    generation_interval: 0.01   # Fast updates for continuous flow (0.6 seconds)
    max_input_rate: 600.0       
    max_output_rate: 600.0      
    internal_capacity: 2000.0   
    continuous_mode: true       
    default_product: "SKU-1001" 
    
  # Sink defaults for continuous collection
  sink:
    collection_rate: 300.0      
    collection_interval: 0.01   # Fast updates for continuous flow
    nominal_rate: 300.0         
    max_input_rate: 350.0       
    max_output_rate: 350.0      
    internal_capacity: 10000.0  
    window_duration: 5.0        
    
  # Equipment defaults for continuous processing
  equipment:
    # Realistic nominal rates for continuous flow
    nominal_rate: 150.0  # Standard production line speed
    performance_factor: 0.75  # Improved from 0.50 (realistic good performance)
    
    # Quality: Good with minimal defects
    quality_rate: 0.96  # 4% defects (improved from 0.94)
    
    # Processing parameters for continuous flow
    processing_interval: 0.01  # Fast updates (0.6 seconds) - 10x faster than batch
    # batch_size removed - deprecated for continuous flow
    
    # Availability: Improved reliability
    # 85% availability = MTBF 120 / (MTBF 120 + MTTR 20)
    mtbf: 120.0  # Improved from 65.0
    mttr: 20.0   # Improved from 32.0
    
    # Reduced micro-stops
    micro_stop_rate: 0.5  # Reduced from 2.0 per hour
    micro_stop_duration: 15.0  # Reduced from 30.0 seconds
    
    # Flow capacity defaults
    max_input_rate: 600.0       
    max_output_rate: 600.0      
    internal_capacity: 1000.0   
    
    # Type-specific defaults
    fill_rate: 90.0            
    pack_size: 12              
    pallet_size: 144           

# Equipment-specific parameters by line and type
equipment_parameters:
  # ========== LINE 1 ==========
  # Line 1: Small scale line - 100 units/min constraint
  # V-curve design maintained
  LINE1-SOURCE:
    generation_rate: 120.0  # +20% of constraint
    generation_interval: 0.01  # Fast continuous updates
    
  LINE1-FIL:
    nominal_rate: 100.0     # Constraint (bottleneck)
    quality_rate: 0.95      # Slightly lower quality
    performance_factor: 0.75 # Good performance (improved from 0.46)
    mtbf: 100.0             # Good reliability
    mttr: 20.0              # Quick repairs
    processing_interval: 0.01
    
  LINE1-PCK:
    nominal_rate: 110.0      # +10% downstream (V-curve)
    quality_rate: 0.96      
    performance_factor: 0.75 
    mtbf: 110.0
    mttr: 18.0              
    processing_interval: 0.01
    
  LINE1-PAL:
    nominal_rate: 130.0      # +30% downstream (V-curve end)
    quality_rate: 0.97      
    performance_factor: 0.75 
    mtbf: 120.0
    mttr: 15.0              
    processing_interval: 0.01
    
  LINE1-SINK:
    collection_rate: 300.0
    collection_interval: 0.01
    
  # ========== LINE 2 ==========
  # Line 2: Standard line - 150 units/min constraint
  LINE2-SOURCE:
    generation_rate: 180.0  # +20% of constraint
    generation_interval: 0.01
    
  LINE2-FIL:
    nominal_rate: 150.0     # Constraint (bottleneck)
    quality_rate: 0.96      
    performance_factor: 0.80 # Better performance (improved from 0.52)
    mtbf: 120.0             
    mttr: 18.0              
    processing_interval: 0.01
    
  LINE2-PCK:
    nominal_rate: 165.0      # +10% downstream
    quality_rate: 0.97      
    performance_factor: 0.80 
    mtbf: 130.0
    mttr: 16.0              
    processing_interval: 0.01
    
  LINE2-PAL:
    nominal_rate: 195.0      # +30% downstream
    quality_rate: 0.97      
    performance_factor: 0.80 
    mtbf: 140.0
    mttr: 15.0              
    processing_interval: 0.01
    
  LINE2-SINK:
    collection_rate: 300.0
    collection_interval: 0.01
    
  # ========== LINE 3 ==========
  # Line 3: High-speed line - 200 units/min constraint
  LINE3-SOURCE:
    generation_rate: 240.0  # +20% of constraint
    generation_interval: 0.01
    
  LINE3-FIL:
    nominal_rate: 200.0     # Constraint (bottleneck)
    quality_rate: 0.97      # Best quality
    performance_factor: 0.85 # Best performance (improved from 0.55)
    mtbf: 150.0             # Best reliability
    mttr: 15.0              # Fastest repairs
    processing_interval: 0.01
    
  LINE3-PCK:
    nominal_rate: 220.0      # +10% downstream
    quality_rate: 0.98      
    performance_factor: 0.85 
    mtbf: 160.0
    mttr: 12.0              
    processing_interval: 0.01
    
  LINE3-PAL:
    nominal_rate: 260.0      # +30% downstream
    quality_rate: 0.98      
    performance_factor: 0.85 
    mtbf: 180.0
    mttr: 10.0              
    processing_interval: 0.01
    
  LINE3-SINK:
    collection_rate: 300.0
    collection_interval: 0.01

# Flow capacity settings
flow_capacity:
  defaults:
    max_input_rate: 600.0  
    max_output_rate: 600.0  
    internal_capacity: 1000.0  
    initial_level: 100.0  
    
  equipment:
    # Filler stations need larger buffers
    LINE1-FIL:
      internal_capacity: 2000.0
      initial_level: 500.0
    LINE2-FIL:
      internal_capacity: 2000.0
      initial_level: 500.0
    LINE3-FIL:
      internal_capacity: 2000.0
      initial_level: 500.0
    
    # Palletizers need larger output buffers
    LINE1-PAL:
      internal_capacity: 1500.0
    LINE2-PAL:
      internal_capacity: 1500.0
    LINE3-PAL:
      internal_capacity: 1500.0
    
    # Sinks with high collection rates
    LINE1-SINK:
      collection_rate: 300.0
      collection_interval: 0.01
    LINE2-SINK:
      collection_rate: 300.0
      collection_interval: 0.01
    LINE3-SINK:
      collection_rate: 300.0
      collection_interval: 0.01