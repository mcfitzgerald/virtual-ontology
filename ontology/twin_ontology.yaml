# Twin Ontology V2
# Based on TBox/RBox structure for proper ontological representation
# This ontology defines the virtual twin structure and control system

# ====================================================================================
# METADATA
# ====================================================================================
metadata:
  name: "Manufacturing Virtual Twin Ontology"
  version: "2.0.0"
  namespace: "twin"
  description: "Ontology-driven virtual twin with two-layer control system for manufacturing simulation"
  author: "Virtual Twin System"
  created: "2024-12-20"
  modified: "2024-12-20"
  imports: []
  license: "MIT"
  tags: ["manufacturing", "simulation", "digital-twin", "mes", "oee"]

# ====================================================================================
# TBOX - Terminological Box (Classes and Properties)
# ====================================================================================
tbox:
  # Class definitions with hierarchy
  classes:
    # Abstract base classes
    SimulationEntity:
      description: "Base class for all entities in the simulation"
      abstract: true
      properties:
        id:
          description: "Unique identifier"
          datatype: "string"
          required: true
          functional: true
        name:
          description: "Human-readable name"
          datatype: "string"
          required: false
        description:
          description: "Entity description"
          datatype: "string"
          required: false
          
    # Physical entities
    PhysicalEntity:
      description: "Entities that process or hold materials"
      parent: "SimulationEntity"
      abstract: true
      properties:
        location:
          description: "Physical or logical location"
          datatype: "string"
          required: false
        capacity:
          description: "Processing or storage capacity"
          datatype: "float"
          required: false
          constraints:
            min: 0
            
    # Equipment hierarchy
    Equipment:
      description: "Processing equipment with internal queues"
      parent: "PhysicalEntity"
      properties:
        equipment_type:
          description: "Type of equipment"
          datatype: "string"
          required: true
          constraints:
            enum: ["Filler", "Packer", "Palletizer", "Generic"]
        line_id:
          description: "Production line assignment"
          datatype: "string"
          required: true
        position:
          description: "Position in line sequence"
          datatype: "integer"
          required: true
          constraints:
            min: 1
        internal_queue_size:
          description: "Capacity of internal queue"
          datatype: "integer"
          required: false
          default: 20
          constraints:
            min: 1
            max: 1000
        base_rate:
          description: "Theoretical capacity in units per minute"
          datatype: "float"
          required: true
          constraints:
            min: 0
        current_state:
          description: "Current operating state"
          datatype: "string"
          required: true
          constraints:
            enum: ["IDLE", "RUNNING", "STOPPED_FAILURE", "STOPPED_MAINTENANCE", 
                   "STARVED", "BLOCKED", "CHANGEOVER"]
        mtbf:
          description: "Mean time between failures in minutes"
          datatype: "float"
          required: false
          default: 480
        mttr:
          description: "Mean time to repair in minutes"
          datatype: "float"
          required: false
          default: 30
          
    Filler:
      description: "Equipment that fills containers"
      parent: "Equipment"
      properties:
        fill_volume:
          description: "Volume per fill in ml"
          datatype: "float"
          required: false
          
    Packer:
      description: "Equipment that packages products"
      parent: "Equipment"
      properties:
        pack_size:
          description: "Units per pack"
          datatype: "integer"
          required: false
          
    Palletizer:
      description: "Equipment that stacks products on pallets"
      parent: "Equipment"
      properties:
        pallet_pattern:
          description: "Stacking pattern identifier"
          datatype: "string"
          required: false
          
    # Flow control entities
    FlowController:
      description: "Entities that control material flow"
      parent: "SimulationEntity"
      abstract: true
      
    Source:
      description: "Material generation point"
      parent: "FlowController"
      properties:
        line_id:
          description: "Associated production line"
          datatype: "string"
          required: true
        arrival_pattern:
          description: "Material generation pattern"
          datatype: "string"
          required: false
          default: "CONSTANT"
          constraints:
            enum: ["CONSTANT", "EXPONENTIAL", "NORMAL", "BATCH"]
        order_mode:
          description: "Order-driven vs continuous generation"
          datatype: "boolean"
          required: false
          default: true
        batch_size:
          description: "Units per batch"
          datatype: "integer"
          required: false
          default: 100
        arrival_rate:
          description: "Units per minute when continuous"
          datatype: "float"
          required: false
          
    Sink:
      description: "Product collection point"
      parent: "FlowController"
      properties:
        line_id:
          description: "Associated production line"
          datatype: "string"
          required: true
        collection_rate:
          description: "Maximum collection rate"
          datatype: "float"
          required: false
        order_tracking:
          description: "Track order completion"
          datatype: "boolean"
          required: false
          default: true
          
    # Information entities
    InformationEntity:
      description: "Non-physical simulation entities"
      parent: "SimulationEntity"
      abstract: true
      
    ProductionOrder:
      description: "Scheduled production run"
      parent: "InformationEntity"
      properties:
        order_id:
          description: "Unique order identifier"
          datatype: "string"
          required: true
          functional: true
        product_id:
          description: "Product to manufacture"
          datatype: "string"
          required: true
        line_id:
          description: "Assigned production line"
          datatype: "string"
          required: true
        start_time:
          description: "Scheduled start time in minutes"
          datatype: "float"
          required: true
          constraints:
            min: 0
        target_quantity:
          description: "Units to produce"
          datatype: "integer"
          required: true
          constraints:
            min: 1
        priority:
          description: "Order priority (1=highest)"
          datatype: "integer"
          required: false
          default: 1
          constraints:
            min: 1
            max: 10
            
    Product:
      description: "Product specification"
      parent: "InformationEntity"
      properties:
        product_id:
          description: "SKU identifier"
          datatype: "string"
          required: true
          functional: true
        name:
          description: "Product name"
          datatype: "string"
          required: true
        changeover_group:
          description: "Group for changeover matrix"
          datatype: "string"
          required: true
          constraints:
            enum: ["A", "B", "C", "D"]
        target_rate:
          description: "Ideal production rate"
          datatype: "float"
          required: false
        scrap_rate_normal:
          description: "Normal operating scrap rate"
          datatype: "float"
          required: false
          default: 0.05
          constraints:
            min: 0
            max: 1
            
    # Control entities
    ControlEntity:
      description: "Entities that control simulation behavior"
      parent: "SimulationEntity"
      abstract: true
      
    Scheduler:
      description: "Production orchestrator"
      parent: "ControlEntity"
      properties:
        schedule_horizon:
          description: "Planning window in days"
          datatype: "integer"
          required: false
          default: 7
          
    Monitor:
      description: "KPI tracker"
      parent: "ControlEntity"
      properties:
        monitoring_interval:
          description: "Data collection frequency in minutes"
          datatype: "float"
          required: false
          default: 5.0

# ====================================================================================
# RBOX - Relational Box (Relationships)
# ====================================================================================
rbox:
  relationships:
    # Material flow relationships
    feeds_into:
      description: "Direct equipment-to-equipment material flow"
      domain: "Equipment"
      range: "Equipment"
      cardinality: "1:1"
      properties:
        symmetric: false
        transitive: false  # Not transitive - must be explicit connections
        reflexive: false
        irreflexive: true  # Cannot feed into itself
      constraints:
        min_cardinality: 0
        max_cardinality: 1  # Each equipment feeds into at most one other
        
    receives_from:
      description: "Inverse of feeds_into"
      domain: "Equipment"
      range: "Equipment"
      cardinality: "1:1"
      inverse_of: "feeds_into"
      properties:
        symmetric: false
        transitive: false
        
    source_feeds:
      description: "Source provides material to first equipment"
      domain: "Source"
      range: "Equipment"
      cardinality: "1:1"
      properties:
        symmetric: false
        transitive: false
        irreflexive: true
        
    sink_collects:
      description: "Sink collects from last equipment"
      domain: "Equipment"
      range: "Sink"
      cardinality: "1:1"
      properties:
        symmetric: false
        transitive: false
        irreflexive: true
        
    # Organizational relationships
    part_of_line:
      description: "Entity belongs to production line"
      domain: "PhysicalEntity"
      range: "ProductionLine"
      cardinality: "N:1"
      properties:
        symmetric: false
        transitive: false
        
    processes_product:
      description: "Order specifies product"
      domain: "ProductionOrder"
      range: "Product"
      cardinality: "N:1"
      properties:
        symmetric: false
        transitive: false
        
    scheduled_on:
      description: "Order assigned to line"
      domain: "ProductionOrder"
      range: "ProductionLine"
      cardinality: "N:1"
      properties:
        symmetric: false
        transitive: false
        
    # Control relationships
    controls:
      description: "Scheduler controls sources"
      domain: "Scheduler"
      range: "Source"
      cardinality: "1:N"
      properties:
        symmetric: false
        transitive: false
        
    monitors:
      description: "Monitor observes entities"
      domain: "Monitor"
      range: "SimulationEntity"
      cardinality: "1:N"
      properties:
        symmetric: false
        transitive: false
        
  # Composed relationships
  property_chains:
    upstream_of:
      chain: ["receives_from", "receives_from"]
      description: "Transitive upstream relationship"
      
    downstream_of:
      chain: ["feeds_into", "feeds_into"]
      description: "Transitive downstream relationship"

# ====================================================================================
# HIERARCHY - Explicit class hierarchy
# ====================================================================================
hierarchy:
  class_hierarchy:
    SimulationEntity:
      - PhysicalEntity:
          - Equipment:
              - Filler
              - Packer
              - Palletizer
      - FlowController:
          - Source
          - Sink
      - InformationEntity:
          - ProductionOrder
          - Product
      - ControlEntity:
          - Scheduler
          - Monitor
          
  property_hierarchy:
    hasProperty:
      - hasIdentifier:
          - id
          - order_id
          - product_id
      - hasCapacity:
          - internal_queue_size
          - base_rate
          - collection_rate
      - hasTemporalProperty:
          - start_time
          - mtbf
          - mttr
      - hasQualityProperty:
          - scrap_rate_normal
          - target_rate

# ====================================================================================
# AXIOMS - Rules and constraints
# ====================================================================================
axioms:
  class_axioms:
    - type: "disjoint"
      classes: ["Equipment", "Source", "Sink"]
      description: "An entity cannot be multiple types simultaneously"
      
    - type: "covering"
      parent: "Equipment"
      children: ["Filler", "Packer", "Palletizer", "Generic"]
      description: "Every Equipment must be one of these types"
      
  property_axioms:
    - type: "functional"
      property: "id"
      description: "Each entity has exactly one unique ID"
      
    - type: "inverse_functional"
      property: "id"
      description: "Each ID belongs to exactly one entity"
      
    - type: "irreflexive"
      property: "feeds_into"
      description: "Equipment cannot feed into itself"
      
  domain_rules:
    - rule: "EquipmentMustHaveRate"
      applies_to: "Equipment"
      constraint: "MUST have property 'base_rate' > 0"
      
    - rule: "OrderedEquipmentPosition"
      applies_to: "Equipment"
      constraint: "position values must be sequential within a line"
      
    - rule: "SingleSourcePerLine"
      applies_to: "Source"
      constraint: "Each line has exactly one source"
      
    - rule: "SingleSinkPerLine"
      applies_to: "Sink"
      constraint: "Each line has exactly one sink"

# ====================================================================================
# CONTROL SYSTEM - Two-layer control architecture
# ====================================================================================
control_system:
  # Layer 1: Actionable controls (what plant managers change)
  actionable_controls:
    changeover_reduction_level:
      type: "discrete"
      datatype: "integer"
      bounds: [0, 2]
      default: 0
      description: "SMED implementation level (0=none, 1=basic, 2=advanced)"
      
    operator_training_hours:
      type: "continuous"
      datatype: "float"
      bounds: [0, 40]
      default: 8
      description: "Monthly training hours per operator"
      
    line_speed_setting:
      type: "continuous"
      datatype: "float"
      bounds: [50, 100]
      default: 85
      description: "Percentage of theoretical maximum speed"
      
    sensor_calibration_frequency:
      type: "continuous"
      datatype: "integer"
      bounds: [1, 30]
      default: 7
      description: "Days between sensor calibrations"
      
    product_sequencing_strategy:
      type: "discrete"
      datatype: "string"
      options: ["random", "changeover_optimized", "campaign_mode"]
      default: "changeover_optimized"
      description: "Product sequencing strategy"
      
    pm_schedule_compliance:
      type: "continuous"
      datatype: "float"
      bounds: [0, 100]
      default: 80
      description: "Percentage of PM tasks completed on time"
      
    staffing_level:
      type: "discrete"
      datatype: "integer"
      bounds: [1, 4]
      default: 2
      description: "Operators per line per shift"
      
    autonomous_maintenance_level:
      type: "discrete"
      datatype: "integer"
      bounds: [0, 3]
      default: 1
      description: "Level of operator-performed maintenance"
      
  # Layer 2: Simulation parameters (internal model responses)
  simulation_parameters:
    micro_stop_probability:
      base_value: 0.3
      unit: "per 5 minutes"
      affected_by: ["sensor_calibration", "line_speed", "autonomous_maintenance"]
      
    micro_stop_duration:
      distribution: "lognormal"
      mean: 0.0
      sigma: 0.5
      unit: "minutes"
      affected_by: ["operator_training"]
      
    performance_factor:
      base_value: 0.85
      affected_by: ["operator_training", "line_speed", "staffing"]
      
    scrap_rate:
      base_value: 0.05
      affected_by: ["line_speed", "operator_training", "sensor_calibration"]

# ====================================================================================
# MAPPINGS - System integration
# ====================================================================================
mappings:
  # SimPy primitive mappings
  primitives:
    Equipment: "EquipmentPrimitive"
    Filler: "EquipmentPrimitive"
    Packer: "EquipmentPrimitive"
    Palletizer: "EquipmentPrimitive"
    Source: "SourcePrimitive"
    Sink: "SinkPrimitive"
    Scheduler: "SchedulerPrimitive"
    Monitor: "MonitorPrimitive"
    
  # MES data mappings
  mes_mappings:
    Equipment:
      table: "equipment_status"
      fields:
        id: "equipment_id"
        current_state: "machine_status"
        
    ProductionOrder:
      table: "production_orders"
      fields:
        order_id: "order_number"
        product_id: "sku"
        target_quantity: "planned_quantity"

# ====================================================================================
# ANNOTATIONS
# ====================================================================================
annotations:
  competency_questions:
    - "What is the current OEE of Line 1?"
    - "Which equipment is the bottleneck?"
    - "How does operator training affect performance?"
    - "What is the optimal line speed for quality?"
    - "When should we schedule changeovers?"
    
  usage_notes:
    - "This ontology defines structure, not values - use manifests for configuration"
    - "All equipment uses internal queues only - no separate buffer entities"
    - "Control effects are discovered through simulation, not prescribed"
    
  changelog:
    - version: "2.0.0"
      date: "2024-12-20"
      changes: 
        - "Complete refactor to TBox/RBox structure"
        - "Removed buffer entities entirely"
        - "Added two-layer control system"
        - "Implemented proper ontological hierarchy"