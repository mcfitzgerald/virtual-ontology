# Twin Database Schema - COMPANION to database_schema.yaml
# Version: 1.0
# Purpose: Documents virtual twin tables that extend the base MES database
# NOTE: This documents ONLY twin-specific tables
# REQUIRES: database_schema.yaml for base MES tables (load both together)

# ====================================================================================
# DATABASE INFO
# ====================================================================================
database:
  name: "MES Database with Twin Extensions"
  type: "SQLite"
  file: "../data/mes_database.db"  # Same database file as base
  description: "Manufacturing database extended with virtual twin simulation tables"
  # Note: 'extends' is documentation only - YAML doesn't support actual imports

# ====================================================================================
# TABLES (Twin-specific tables)
# ====================================================================================
tables:
  - name: "twin_runs"
    description: "Simulation run metadata and lineage tracking"
    primary_key: "run_id"
    indexes: ["run_type", "parent_run_id", "started_at", "status"]
    ontology_class: "SimulationRun"
    
  - name: "simulation_data"
    description: "Time-series data from simulation runs (mirrors mes_data structure)"
    primary_key: "id"
    indexes: ["run_id", "timestamp", "equipment_id", "line_id"]
    foreign_keys:
      - column: "run_id"
        references: "twin_runs.run_id"
    ontology_class: "SimulationData"
    
  - name: "twin_state"
    description: "Current state of virtual twin including parameters and sync status"
    primary_key: "state_id"
    indexes: ["timestamp", "current_run_id"]
    ontology_class: "TwinState"
    
  - name: "parameter_history"
    description: "Tracks parameter changes across simulation runs"
    primary_key: "change_id"
    indexes: ["run_id", "parameter_name", "timestamp"]
    foreign_keys:
      - column: "run_id"
        references: "twin_runs.run_id"
    ontology_class: "ActionableParameter"
    
  - name: "simulation_configs"
    description: "Stores full configuration JSON for each simulation"
    primary_key: "config_id"
    indexes: ["run_id", "config_hash", "config_type"]
    foreign_keys:
      - column: "run_id"
        references: "twin_runs.run_id"
    ontology_class: "SimulationConfig"
    
  - name: "optimization_results"
    description: "Results from multi-objective optimization runs"
    primary_key: "id"
    indexes: ["run_id", "generation"]
    foreign_keys:
      - column: "run_id"
        references: "twin_runs.run_id"
    ontology_class: "OptimizationResult"
    
  - name: "recommendations"
    description: "Actionable recommendations generated from simulations"
    primary_key: "recommendation_id"
    indexes: ["run_id", "recommendation_type", "created_at"]
    foreign_keys:
      - column: "run_id"
        references: "twin_runs.run_id"
    ontology_class: "Recommendation"

# ====================================================================================
# PROPERTIES (Twin table columns with ontology mapping)
# ====================================================================================
properties:
  # === twin_runs table ===
  runId:
    type: "string"
    sql_column: "run_id"
    sql_table: "twin_runs"
    required: true
    business_name: "Simulation Run ID"
    description: "Unique identifier for simulation run"
    examples: ["baseline-2025-01-10-001", "sim-opt-2025-01-10-042"]
    
  runType:
    type: "string"
    sql_column: "run_type"
    sql_table: "twin_runs"
    required: false
    business_name: "Run Type"
    validation:
      values: ["baseline", "simulation", "optimization"]
    
  seed:
    type: "integer"
    sql_column: "seed"
    sql_table: "twin_runs"
    required: true
    business_name: "Random Seed"
    description: "Seed for reproducible simulations"
    
  generatorVersion:
    type: "string"
    sql_column: "generator_version"
    sql_table: "twin_runs"
    required: true
    business_name: "Generator Version"
    
  parentRunId:
    type: "string"
    sql_column: "parent_run_id"
    sql_table: "twin_runs"
    required: false
    business_name: "Parent Run ID"
    description: "Links to parent run for lineage tracking"
    
  startedAt:
    type: "datetime"
    sql_column: "started_at"
    sql_table: "twin_runs"
    required: true
    business_name: "Start Time"
    
  finishedAt:
    type: "datetime"
    sql_column: "finished_at"
    sql_table: "twin_runs"
    required: false
    business_name: "End Time"
    
  configDeltaJson:
    type: "string"
    sql_column: "config_delta_json"
    sql_table: "twin_runs"
    required: true
    business_name: "Configuration Changes"
    description: "JSON of parameter changes from baseline"
    
  dataHash:
    type: "string"
    sql_column: "data_hash"
    sql_table: "twin_runs"
    required: false
    business_name: "Data Hash"
    description: "SHA256 hash for data integrity"
    
  outputPath:
    type: "string"
    sql_column: "output_path"
    sql_table: "twin_runs"
    required: false
    business_name: "Output File Path"
    
  kpiSummaryJson:
    type: "string"
    sql_column: "kpi_summary_json"
    sql_table: "twin_runs"
    required: false
    business_name: "KPI Summary"
    description: "JSON summary of key performance indicators"
    
  notes:
    type: "string"
    sql_column: "notes"
    sql_table: "twin_runs"
    required: false
    business_name: "Notes"
    
  status:
    type: "string"
    sql_column: "status"
    sql_table: "twin_runs"
    required: true
    business_name: "Run Status"
    validation:
      values: ["pending", "running", "completed", "failed"]
    
  # === twin_state table ===
  stateId:
    type: "integer"
    sql_column: "state_id"
    sql_table: "twin_state"
    required: true
    business_name: "State ID"
    
  stateTimestamp:
    type: "datetime"
    sql_column: "timestamp"
    sql_table: "twin_state"
    required: true
    business_name: "State Timestamp"
    
  currentRunId:
    type: "string"
    sql_column: "current_run_id"
    sql_table: "twin_state"
    required: false
    business_name: "Current Run ID"
    
  baselineRunId:
    type: "string"
    sql_column: "baseline_run_id"
    sql_table: "twin_state"
    required: false
    business_name: "Baseline Run ID"
    
  parametersJson:
    type: "string"
    sql_column: "parameters_json"
    sql_table: "twin_state"
    required: true
    business_name: "Current Parameters"
    description: "JSON of current actionable parameters"
    
  kpisJson:
    type: "string"
    sql_column: "kpis_json"
    sql_table: "twin_state"
    required: true
    business_name: "Current KPIs"
    
  syncStatusJson:
    type: "string"
    sql_column: "sync_status_json"
    sql_table: "twin_state"
    required: false
    business_name: "Sync Status"
    description: "Synchronization health status"
    
  # === parameter_history table ===
  changeId:
    type: "integer"
    sql_column: "change_id"
    sql_table: "parameter_history"
    required: true
    business_name: "Change ID"
    
  parameterName:
    type: "string"
    sql_column: "parameter_name"
    sql_table: "parameter_history"
    required: true
    business_name: "Parameter Name"
    validation:
      values: ["micro_stop_probability", "performance_factor", "scrap_multiplier", 
               "material_reliability", "cascade_sensitivity"]
    
  oldValue:
    type: "float"
    sql_column: "old_value"
    sql_table: "parameter_history"
    required: false
    business_name: "Previous Value"
    
  newValue:
    type: "float"
    sql_column: "new_value"
    sql_table: "parameter_history"
    required: true
    business_name: "New Value"
    
  changeReason:
    type: "string"
    sql_column: "change_reason"
    sql_table: "parameter_history"
    required: false
    business_name: "Change Reason"
    
  # === simulation_configs table ===
  configId:
    type: "string"
    sql_column: "config_id"
    sql_table: "simulation_configs"
    required: true
    business_name: "Configuration ID"
    
  configType:
    type: "string"
    sql_column: "config_type"
    sql_table: "simulation_configs"
    required: false
    business_name: "Configuration Type"
    validation:
      values: ["full", "delta", "base"]
    
  configJson:
    type: "string"
    sql_column: "config_json"
    sql_table: "simulation_configs"
    required: true
    business_name: "Full Configuration"
    description: "Complete configuration JSON"
    
  configHash:
    type: "string"
    sql_column: "config_hash"
    sql_table: "simulation_configs"
    required: true
    business_name: "Configuration Hash"
    description: "SHA256 hash for deduplication"
    
  configDescription:
    type: "string"
    sql_column: "description"
    sql_table: "simulation_configs"
    required: false
    business_name: "Configuration Description"
    
  configCreatedAt:
    type: "datetime"
    sql_column: "created_at"
    sql_table: "simulation_configs"
    required: true
    business_name: "Created At"
    
  # === optimization_results table ===
  optimizationId:
    type: "integer"
    sql_column: "id"
    sql_table: "optimization_results"
    required: true
    business_name: "Optimization ID"
    
  generation:
    type: "integer"
    sql_column: "generation"
    sql_table: "optimization_results"
    required: true
    business_name: "Generation Number"
    description: "Evolutionary generation in optimization"
    
  solutionIndex:
    type: "integer"
    sql_column: "solution_index"
    sql_table: "optimization_results"
    required: true
    business_name: "Solution Index"
    
  objectivesJson:
    type: "string"
    sql_column: "objectives_json"
    sql_table: "optimization_results"
    required: true
    business_name: "Objective Values"
    description: "JSON of objective function values"
    
  parametersOptJson:
    type: "string"
    sql_column: "parameters_json"
    sql_table: "optimization_results"
    required: true
    business_name: "Optimized Parameters"
    
  isDominated:
    type: "boolean"
    sql_column: "is_dominated"
    sql_table: "optimization_results"
    required: false
    business_name: "Is Dominated"
    description: "False if part of Pareto front"
    
  # === recommendations table ===
  recommendationId:
    type: "integer"
    sql_column: "recommendation_id"
    sql_table: "recommendations"
    required: true
    business_name: "Recommendation ID"
    
  recommendationType:
    type: "string"
    sql_column: "recommendation_type"
    sql_table: "recommendations"
    required: false
    business_name: "Recommendation Type"
    validation:
      values: ["oee_improvement", "downtime_reduction", "quality_improvement", 
               "energy_efficiency", "cost_reduction"]
    
  recommendationJson:
    type: "string"
    sql_column: "parameters_json"
    sql_table: "recommendations"
    required: true
    business_name: "Recommended Parameters"
    
  expectedImpactJson:
    type: "string"
    sql_column: "expected_impact_json"
    sql_table: "recommendations"
    required: false
    business_name: "Expected Impact"
    description: "JSON of expected KPI improvements"
    
  confidenceScore:
    type: "float"
    sql_column: "confidence_score"
    sql_table: "recommendations"
    required: false
    business_name: "Confidence Score"
    validation:
      min: 0
      max: 1
    
  implementationStatus:
    type: "string"
    sql_column: "implementation_status"
    sql_table: "recommendations"
    required: false
    business_name: "Implementation Status"
    validation:
      values: ["pending", "approved", "implemented", "rejected"]

# ====================================================================================
# RELATIONSHIPS (Between twin tables)
# ====================================================================================
relationships:
  run_to_simulation_data:
    from_table: "twin_runs"
    from_column: "run_id"
    to_table: "simulation_data"
    to_column: "run_id"
    type: "one-to-many"
    description: "Each run generates many simulation data points"
    
  run_to_parameters:
    from_table: "twin_runs"
    from_column: "run_id"
    to_table: "parameter_history"
    to_column: "run_id"
    type: "one-to-many"
    description: "Each run tracks parameter changes"
    
  run_to_config:
    from_table: "twin_runs"
    from_column: "run_id"
    to_table: "simulation_configs"
    to_column: "run_id"
    type: "one-to-one"
    description: "Each run has one configuration"
    
  run_to_optimization:
    from_table: "twin_runs"
    from_column: "run_id"
    to_table: "optimization_results"
    to_column: "run_id"
    type: "one-to-many"
    description: "Optimization runs produce many solutions"
    
  run_to_recommendations:
    from_table: "twin_runs"
    from_column: "run_id"
    to_table: "recommendations"
    to_column: "run_id"
    type: "one-to-many"
    description: "Runs can generate recommendations"
    
  parent_child_runs:
    from_table: "twin_runs"
    from_column: "parent_run_id"
    to_table: "twin_runs"
    to_column: "run_id"
    type: "many-to-one"
    description: "Simulation lineage tracking"
    
  state_to_run:
    from_table: "twin_state"
    from_column: "current_run_id"
    to_table: "twin_runs"
    to_column: "run_id"
    type: "many-to-one"
    description: "Twin state references current run"

# ====================================================================================
# MAPPINGS
# ====================================================================================
mappings:
  ontology_namespace: "twin"
  extends_namespace: "mes"
  auto_mapped: false
  
  # Mapping to twin ontology classes
  table_to_class:
    twin_runs: "SimulationRun"
    twin_state: "TwinState"
    parameter_history: "ActionableParameter"
    simulation_configs: "SimulationConfig"
    optimization_results: "OptimizationResult"
    recommendations: "Recommendation"
    simulation_data: "SimulationData"
  
  # Property naming convention
  mapping_rules:
    snake_case_to_camelCase: true
    prefix_with_has: false  # Twin properties don't use 'has' prefix

# ====================================================================================
# METADATA
# ====================================================================================
metadata:
  generated: "2025-01-10"
  source: "Manual documentation"
  version: "1.0"
  extends: "./database_schema.yaml"
  description: "Twin extension tables for simulation and optimization"