# Tunable Parameters Configuration Example
# This file contains all operational parameters for the simulation
# All equipment, source, and sink parameters are consolidated here

metadata:
  name: Simulation Tunable Parameters
  version: 2.0.0
  description: Consolidated operational parameters for production line simulation
  created: '2025-09-13'

# Global defaults for all equipment types
defaults:
  source:
    generation_rate: 60.0         # Units per minute
    generation_interval: 0.01     # Update every 0.01 minutes (0.6 seconds)
    continuous_mode: true         # Continuous generation (not batch)
    default_product: SKU-1001

  equipment:
    performance_factor: 0.85      # 85% of nominal rate
    processing_interval: 0.01     # Process every 0.01 minutes
    quality_rate: 0.95           # 95% good products
    mtbf: 120.0                  # Mean time between failures (minutes)
    mttr: 10.0                   # Mean time to repair (minutes)
    micro_stop_rate: 3.0         # Micro-stops per hour
    micro_stop_duration: 60.0    # Duration in seconds

  sink:
    collection_rate: 50.0        # Units per minute collected
    collection_interval: 0.01    # Update frequency
    window_duration: 5.0         # OEE calculation window (minutes)

# Equipment-specific parameters (override defaults)
equipment_parameters:
  # Line 1 Equipment
  LINE1-SOURCE:
    generation_rate: 60.0
    generation_interval: 0.01
    continuous_mode: true
    default_product: SKU-1001

  LINE1-FIL:
    nominal_rate: 50.0           # Filling rate (units/min)
    fill_rate: 50.0              # Actual fill rate
    quality_rate: 0.95
    performance_factor: 0.9
    processing_interval: 0.01
    mtbf: 30.0                   # More frequent failures
    mttr: 8.0
    micro_stop_rate: 5.0
    micro_stop_duration: 30.0

  LINE1-PCK:
    nominal_rate: 52.0           # Packing rate (units/min)
    pack_size: 12                # Units per pack
    quality_rate: 0.94
    performance_factor: 0.88
    processing_interval: 0.01
    mtbf: 90.0
    mttr: 7.0
    micro_stop_rate: 2.0
    micro_stop_duration: 45.0

  LINE1-SINK:
    nominal_rate: 50.0           # Expected collection rate
    collection_rate: 55.0        # Actual collection capacity
    collection_interval: 0.01
    window_duration: 5.0

  # Line 2 Equipment (similar structure)
  LINE2-SOURCE:
    generation_rate: 55.0
    generation_interval: 0.01
    continuous_mode: true
    default_product: SKU-2001

  LINE2-FIL:
    nominal_rate: 48.0
    quality_rate: 0.93
    performance_factor: 0.85
    processing_interval: 0.01
    mtbf: 120.0
    mttr: 12.0

  LINE2-PCK:
    nominal_rate: 50.0
    pack_size: 6
    quality_rate: 0.96
    performance_factor: 0.87
    processing_interval: 0.01
    mtbf: 150.0
    mttr: 10.0

  LINE2-SINK:
    nominal_rate: 48.0
    collection_rate: 52.0
    collection_interval: 0.01
    window_duration: 5.0

# Optional: Debug mode for verbose logging
debug_mode: false  # Set to true for detailed simulation output

# Optional: Performance tuning
performance:
  parallel_processing: true
  batch_metrics_update: true
  metrics_update_interval: 1.0  # Minutes between metric updates

# Optional: MES integration settings (if using MES collector)
mes_settings:
  bucket_size: 5.0              # Time bucket for MES records (minutes)
  include_micro_stops: true
  track_changeovers: true
  output_file: test_mes_output.csv