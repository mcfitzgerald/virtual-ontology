# Schedule Generator Configuration Example
# Production scheduling with various optimization strategies

metadata:
  name: "Schedule Generator Configuration"
  version: "1.0.0"
  description: "Example configuration for production schedule generation"

# Basic schedule generation
schedule_generation:
  # Sequencing strategy
  sequence_mode: "optimized"       # Minimize changeovers
  # sequence_mode: "random"        # For baseline generation
  # sequence_mode: "campaign"      # Long production runs
  
  # Batch sizing strategy
  batch_sizing: "dynamic"          # Adjust based on demand
  # batch_sizing: "fixed"          # Fixed batch sizes
  # batch_sizing: "economic"       # Economic order quantity
  
  # Batch duration constraints
  min_batch_hours: 4.0            # Minimum 4-hour batches
  max_batch_hours: 12.0           # Maximum 12-hour batches
  
  # Changeover optimization
  changeover_frequency_target: 0.10  # Target 10% changeover time
  max_changeovers_per_day: 6         # Limit daily changeovers

# Product family definitions
product_families:
  water_products:
    family_id: "WATER"
    products:
      - "SKU-1001"  # 8oz Water
      - "SKU-1002"  # 16oz Water
      - "SKU-1003"  # 1L Water
    internal_changeover: 15        # Minutes within family
    allergen_group: "none"
    
  soda_products:
    family_id: "SODA"
    products:
      - "SKU-2001"  # 12oz Soda
      - "SKU-2002"  # 16oz Energy
      - "SKU-2003"  # 20oz Soda
    internal_changeover: 15
    allergen_group: "caffeine"
    
  juice_products:
    family_id: "JUICE"
    products:
      - "SKU-3001"  # 12oz Juice
      - "SKU-3002"  # 1L Juice
      - "SKU-3003"  # 64oz Juice
    internal_changeover: 20
    allergen_group: "fruit"

# Changeover matrix between families
family_changeover_matrix:
  WATER:
    WATER: 0      # No changeover within family
    SODA: 30      # 30 minutes water to soda
    JUICE: 45     # 45 minutes water to juice (cleaning)
  
  SODA:
    WATER: 35     # 35 minutes soda to water (cleaning)
    SODA: 0
    JUICE: 40     # 40 minutes soda to juice
  
  JUICE:
    WATER: 50     # 50 minutes juice to water (deep clean)
    SODA: 45      # 45 minutes juice to soda
    JUICE: 0

# Optimized sequencing configuration
optimized_sequencing:
  optimization_objective: "minimize_changeover"
  # optimization_objective: "maximize_throughput"
  # optimization_objective: "minimize_cost"
  
  # Sequencing rules
  rules:
    - "Group same family products together"
    - "Sequence light to dark colors"
    - "Non-allergen before allergen products"
    - "Small to large container sizes"
  
  # Weights for multi-objective optimization
  weights:
    changeover_time: 0.4
    throughput: 0.3
    due_date: 0.2
    inventory_cost: 0.1

# Campaign mode configuration
campaign_mode:
  campaign_duration_days: 2        # Run same family for 2 days
  min_campaign_size: 10000        # Minimum 10,000 units per campaign
  
  # Campaign sequence
  campaign_sequence:
    - family: "WATER"
      duration_days: 2
      products: ["SKU-1001", "SKU-1002", "SKU-1003"]
    
    - family: "SODA"
      duration_days: 3
      products: ["SKU-2001", "SKU-2002", "SKU-2003"]
    
    - family: "JUICE"
      duration_days: 2
      products: ["SKU-3001", "SKU-3002", "SKU-3003"]

# Dynamic batch sizing
dynamic_batch_sizing:
  # Demand consideration
  demand_window_days: 7           # Look ahead 7 days
  demand_coverage: 1.2            # Produce 120% of demand
  
  # Size adjustment factors
  factors:
    high_demand_multiplier: 1.5   # Increase batch for high demand
    low_demand_multiplier: 0.7    # Decrease batch for low demand
    setup_cost_weight: 0.3        # Consider setup costs
    holding_cost_weight: 0.2      # Consider inventory costs
  
  # Constraints
  constraints:
    max_inventory_days: 5         # Don't produce > 5 days inventory
    min_production_run: 1000      # Minimum 1000 units per run

# Sub-optimal schedule generation (for baselines)
suboptimal_schedule:
  sequence_mode: "random"         # Random product sequence
  
  # Poor batch sizing
  min_batch_hours: 2.0            # Too short (excessive changeovers)
  max_batch_hours: 6.0            # Still short
  
  # No optimization
  ignore_product_families: true   # Don't group families
  ignore_changeover_costs: true   # Don't minimize changeovers
  
  # Random parameters
  random_seed: 42                 # For reproducibility
  changeover_probability: 0.3     # 30% chance of random changeover

# Line assignment strategy
line_assignment:
  strategy: "capability_based"    # Assign based on line capabilities
  # strategy: "load_balanced"      # Balance load across lines
  # strategy: "dedicated"          # Dedicated lines per family
  
  # Line capabilities
  line_capabilities:
    LINE1:
      max_rate: 100
      products: ["SKU-1001", "SKU-1002", "SKU-1003"]
      preferred_family: "WATER"
    
    LINE2:
      max_rate: 150
      products: "all"              # Can handle all products
      preferred_family: "SODA"
    
    LINE3:
      max_rate: 200
      products: "all"
      preferred_family: "JUICE"

# Schedule evaluation metrics
evaluation_metrics:
  track_metrics:
    - total_changeover_time
    - changeover_frequency
    - average_batch_size
    - line_utilization
    - on_time_delivery
    - inventory_levels
  
  targets:
    changeover_percentage: 0.10   # Target < 10% changeover
    line_utilization: 0.85        # Target 85% utilization
    on_time_delivery: 0.95        # Target 95% on-time

# Integration with MES
mes_integration:
  update_frequency: "on_changeover"  # Update MES on each changeover
  # update_frequency: "hourly"       # Alternative: hourly updates
  
  send_events:
    - order_started
    - order_completed
    - changeover_started
    - changeover_completed
    - batch_completed