# Equipment Instances Manifest
# Defines specific equipment instances and their structural properties
# NO TUNABLE PARAMETERS - those are in config/tunable_parameters.yaml

metadata:
  name: "Equipment Instances"
  version: "1.0.0"
  description: "Equipment instances for three production lines"
  created: "2025-09-02"
  ontology: "filling_line_ontology.yaml"

# Production lines
production_lines:
  LINE1:
    name: "High-Volume Beverage Line"
    description: "Primary line for bottles and cans"
    products_supported: ["SKU-1001", "SKU-1002", "SKU-2001", "SKU-2002", "SKU-3002"]
    
  LINE2:
    name: "Flexible Production Line"
    description: "Multi-purpose line for various containers"
    products_supported: ["SKU-1001", "SKU-1002", "SKU-2002", "SKU-3001", "SKU-3002"]
    
  LINE3:
    name: "Specialty Line"
    description: "Line for juices and specialty products"
    products_supported: ["SKU-2001", "SKU-2002", "SKU-3001", "SKU-3002"]

# Equipment instances
equipment:
  # LINE1 Equipment
  LINE1-SOURCE:
    type: "MaterialSource"
    line_id: "LINE1"
    position: 0
    description: "Material source for LINE1"
    
  LINE1-FIL:
    type: "FillingStation"
    line_id: "LINE1"
    position: 10
    description: "Filler for LINE1"
    equipment_model: "ACME_FILLER_5000"
    
  LINE1-PCK:
    type: "PackingStation"
    line_id: "LINE1"
    position: 20
    description: "Packer for LINE1"
    equipment_model: "SPEEDPACK_2000"
    
  LINE1-PAL:
    type: "PalletizingStation"
    line_id: "LINE1"
    position: 30
    description: "Palletizer for LINE1"
    equipment_model: "ROBOPAL_X1"
    
  LINE1-SINK:
    type: "ProductCollection"
    line_id: "LINE1"
    position: 100
    description: "Product collection for LINE1"
    
  # LINE2 Equipment
  LINE2-SOURCE:
    type: "MaterialSource"
    line_id: "LINE2"
    position: 0
    description: "Material source for LINE2"
    
  LINE2-FIL:
    type: "FillingStation"
    line_id: "LINE2"
    position: 10
    description: "Filler for LINE2"
    equipment_model: "FLEXFILL_3000"
    
  LINE2-PCK:
    type: "PackingStation"
    line_id: "LINE2"
    position: 20
    description: "Packer for LINE2"
    equipment_model: "MULTIPACK_1500"
    
  LINE2-PAL:
    type: "PalletizingStation"
    line_id: "LINE2"
    position: 30
    description: "Palletizer for LINE2"
    equipment_model: "PALMASTER_2000"
    
  LINE2-SINK:
    type: "ProductCollection"
    line_id: "LINE2"
    position: 100
    description: "Product collection for LINE2"
    
  # LINE3 Equipment
  LINE3-SOURCE:
    type: "MaterialSource"
    line_id: "LINE3"
    position: 0
    description: "Material source for LINE3"
    
  LINE3-FIL:
    type: "FillingStation"
    line_id: "LINE3"
    position: 10
    description: "Filler for LINE3"
    equipment_model: "PRECISIONFILL_4000"
    
  LINE3-PCK:
    type: "PackingStation"
    line_id: "LINE3"
    position: 20
    description: "Packer for LINE3"
    equipment_model: "ECOPACK_1000"
    
  LINE3-PAL:
    type: "PalletizingStation"
    line_id: "LINE3"
    position: 30
    description: "Palletizer for LINE3"
    equipment_model: "SMARTPAL_3000"
    
  LINE3-SINK:
    type: "ProductCollection"
    line_id: "LINE3"
    position: 100
    description: "Product collection for LINE3"

# Equipment specifications (capabilities, not tunable parameters)
equipment_specifications:
  ACME_FILLER_5000:
    manufacturer: "ACME Corp"
    model_year: 2020
    max_capacity: 60.0  # units/minute physical maximum
    min_capacity: 10.0
    supported_container_sizes: [8, 12, 16, 32, 64]  # oz
    
  SPEEDPACK_2000:
    manufacturer: "SpeedPack Inc"
    model_year: 2019
    max_capacity: 55.0
    min_capacity: 15.0
    pack_configurations: [6, 12, 24]
    
  ROBOPAL_X1:
    manufacturer: "RoboPal"
    model_year: 2021
    max_capacity: 52.0
    min_capacity: 20.0
    pallet_patterns: ["standard", "interlocked", "column"]
    
  FLEXFILL_3000:
    manufacturer: "FlexTech"
    model_year: 2020
    max_capacity: 55.0
    min_capacity: 10.0
    supported_container_sizes: [8, 12, 16, 32]
    
  MULTIPACK_1500:
    manufacturer: "MultiPack Systems"
    model_year: 2018
    max_capacity: 53.0
    min_capacity: 12.0
    pack_configurations: [6, 12, 18, 24]
    
  PALMASTER_2000:
    manufacturer: "PalMaster"
    model_year: 2020
    max_capacity: 50.0
    min_capacity: 18.0
    pallet_patterns: ["standard", "interlocked"]
    
  PRECISIONFILL_4000:
    manufacturer: "Precision Systems"
    model_year: 2022
    max_capacity: 58.0
    min_capacity: 8.0
    supported_container_sizes: [8, 12, 16, 32, 64]
    precision: 0.1  # % accuracy
    
  ECOPACK_1000:
    manufacturer: "EcoPack"
    model_year: 2021
    max_capacity: 54.0
    min_capacity: 10.0
    pack_configurations: [6, 12, 24]
    eco_certified: true
    
  SMARTPAL_3000:
    manufacturer: "SmartPal"
    model_year: 2023
    max_capacity: 51.0
    min_capacity: 15.0
    pallet_patterns: ["standard", "interlocked", "custom"]
    ai_optimization: true

# Connections (topology)
connections:
  - from: "LINE1-SOURCE"
    to: "LINE1-FIL"
    type: "material_flow"
    
  - from: "LINE1-FIL"
    to: "LINE1-PCK"
    type: "material_flow"
    
  - from: "LINE1-PCK"
    to: "LINE1-PAL"
    type: "material_flow"
    
  - from: "LINE1-PAL"
    to: "LINE1-SINK"
    type: "material_flow"
    
  - from: "LINE2-SOURCE"
    to: "LINE2-FIL"
    type: "material_flow"
    
  - from: "LINE2-FIL"
    to: "LINE2-PCK"
    type: "material_flow"
    
  - from: "LINE2-PCK"
    to: "LINE2-PAL"
    type: "material_flow"
    
  - from: "LINE2-PAL"
    to: "LINE2-SINK"
    type: "material_flow"
    
  - from: "LINE3-SOURCE"
    to: "LINE3-FIL"
    type: "material_flow"
    
  - from: "LINE3-FIL"
    to: "LINE3-PCK"
    type: "material_flow"
    
  - from: "LINE3-PCK"
    to: "LINE3-PAL"
    type: "material_flow"
    
  - from: "LINE3-PAL"
    to: "LINE3-SINK"
    type: "material_flow"