# MES Database Schema Template
# Purpose: SQL database schema that stores MES data
# MUST map to MES ontology properties for semantic consistency

metadata:
  name: "MES Database Schema"
  version: "1.0.0"
  description: "SQL schema for manufacturing execution system data"
  generated: "<TIMESTAMP>"
  source: "Twin simulation or Real MES"
  ontology_namespace: "mes"  # Which ontology this implements

# ====================================================================================
# DATABASE INFO
# ====================================================================================
database:
  type: "SQLite"  # or PostgreSQL, MySQL, etc.
  name: "mes_production.db"
  file: "./data/mes_production.db"  # For SQLite
  # connection: "postgresql://user:pass@host:port/db"  # For other databases
  description: "Manufacturing execution system production data"

# ====================================================================================
# TABLES (SQL structure that implements ontology classes)
# ====================================================================================
tables:
  # Main fact table - implements ProductionSnapshot class
  mes_data:
    description: "5-minute production snapshots"
    ontology_class: "ProductionSnapshot"
    primary_key: ["Timestamp", "EquipmentID"]  # Composite key
    indexes:
      - ["Timestamp"]
      - ["LineID"]
      - ["EquipmentID"]
      - ["ProductID"]
      - ["MachineStatus"]
    
    columns:
      # Temporal columns
      Timestamp:
        type: "DATETIME"
        nullable: false
        ontology_property: "Timestamp"
        description: "Snapshot timestamp"
      
      # Identity columns
      ProductionOrderID:
        type: "VARCHAR(20)"
        nullable: false
        ontology_property: "ProductionOrderID"
        description: "Production order identifier"
      
      LineID:
        type: "INTEGER"
        nullable: false
        ontology_property: "LineID"
        description: "Production line number"
        check: "LineID BETWEEN 1 AND 10"
      
      EquipmentID:
        type: "VARCHAR(20)"
        nullable: false
        ontology_property: "EquipmentID"
        description: "Equipment identifier"
        pattern: "LINE[0-9]-[A-Z]{3}"
      
      EquipmentType:
        type: "VARCHAR(20)"
        nullable: false
        ontology_property: "EquipmentType"
        description: "Type of equipment"
        check: "EquipmentType IN ('Filler', 'Packer', 'Palletizer')"
      
      # Product columns
      ProductID:
        type: "VARCHAR(10)"
        nullable: false
        ontology_property: "ProductID"
        description: "Product SKU"
        pattern: "SKU-[0-9]{4}"
      
      ProductName:
        type: "VARCHAR(50)"
        nullable: false
        ontology_property: "ProductName"
        description: "Product description"
      
      # State columns
      MachineStatus:
        type: "VARCHAR(10)"
        nullable: false
        ontology_property: "MachineStatus"
        description: "Equipment status"
        check: "MachineStatus IN ('Running', 'Stopped', 'Idle')"
      
      DowntimeReason:
        type: "VARCHAR(20)"
        nullable: true
        default: "''"
        ontology_property: "DowntimeReason"
        description: "Reason for downtime"
        check: "DowntimeReason IN ('UNP-JAM', 'UNP-MECH', 'UNP-ELEC', 'PL-CLEAN', 'PL-SETUP', '')"
      
      # Production columns
      GoodUnitsProduced:
        type: "INTEGER"
        nullable: false
        default: 0
        ontology_property: "GoodUnitsProduced"
        description: "Good units in interval"
        check: "GoodUnitsProduced >= 0"
      
      ScrapUnitsProduced:
        type: "INTEGER"
        nullable: false
        default: 0
        ontology_property: "ScrapUnitsProduced"
        description: "Scrap units in interval"
        check: "ScrapUnitsProduced >= 0"
      
      TargetRate_units_per_5min:
        type: "INTEGER"
        nullable: false
        ontology_property: "TargetRate"
        description: "Target production rate"
        check: "TargetRate_units_per_5min > 0"
      
      # Cost columns
      StandardCost_per_unit:
        type: "DECIMAL(10,2)"
        nullable: false
        ontology_property: "StandardCost_per_unit"
        description: "Manufacturing cost per unit"
        check: "StandardCost_per_unit >= 0"
      
      SalePrice_per_unit:
        type: "DECIMAL(10,2)"
        nullable: false
        ontology_property: "SalePrice_per_unit"
        description: "Selling price per unit"
        check: "SalePrice_per_unit >= 0"
      
      # OEE columns
      Availability_Score:
        type: "DECIMAL(5,2)"
        nullable: false
        ontology_property: "Availability_Score"
        description: "Availability percentage"
        check: "Availability_Score BETWEEN 0 AND 100"
      
      Performance_Score:
        type: "DECIMAL(5,2)"
        nullable: false
        ontology_property: "Performance_Score"
        description: "Performance percentage"
        check: "Performance_Score BETWEEN 0 AND 120"
      
      Quality_Score:
        type: "DECIMAL(5,2)"
        nullable: false
        ontology_property: "Quality_Score"
        description: "Quality percentage"
        check: "Quality_Score BETWEEN 0 AND 100"
      
      OEE_Score:
        type: "DECIMAL(5,2)"
        nullable: false
        ontology_property: "OEE_Score"
        description: "Overall Equipment Effectiveness"
        check: "OEE_Score BETWEEN 0 AND 100"

# ====================================================================================
# VIEWS (Derived tables for common queries)
# ====================================================================================
views:
  # Equipment dimension view
  v_equipment:
    description: "Unique equipment with latest status"
    ontology_class: "Equipment"
    sql: |
      CREATE VIEW v_equipment AS
      SELECT DISTINCT
        EquipmentID,
        EquipmentType,
        LineID,
        FIRST_VALUE(MachineStatus) OVER (
          PARTITION BY EquipmentID 
          ORDER BY Timestamp DESC
        ) as CurrentStatus
      FROM mes_data
  
  # Production lines view
  v_lines:
    description: "Production lines with current metrics"
    ontology_class: "ProductionLine"
    sql: |
      CREATE VIEW v_lines AS
      SELECT 
        LineID,
        COUNT(DISTINCT EquipmentID) as EquipmentCount,
        AVG(OEE_Score) as AvgOEE,
        MIN(OEE_Score) as BottleneckOEE
      FROM mes_data
      WHERE Timestamp >= datetime('now', '-1 hour')
      GROUP BY LineID
  
  # Products view
  v_products:
    description: "Products with production stats"
    ontology_class: "Product"
    sql: |
      CREATE VIEW v_products AS
      SELECT 
        ProductID,
        ProductName,
        AVG(StandardCost_per_unit) as AvgCost,
        AVG(SalePrice_per_unit) as AvgPrice,
        SUM(GoodUnitsProduced) as TotalProduced,
        SUM(ScrapUnitsProduced) as TotalScrapped
      FROM mes_data
      GROUP BY ProductID, ProductName

# ====================================================================================
# CONSTRAINTS (Business rules enforced in database)
# ====================================================================================
constraints:
  # Data consistency constraints
  no_production_when_stopped:
    type: "CHECK"
    table: "mes_data"
    sql: |
      CHECK (
        MachineStatus != 'Stopped' OR 
        (GoodUnitsProduced = 0 AND ScrapUnitsProduced = 0)
      )
    ontology_rule: "no_production_when_stopped"
  
  downtime_reason_when_stopped:
    type: "CHECK"
    table: "mes_data"
    sql: |
      CHECK (
        MachineStatus != 'Stopped' OR 
        (DowntimeReason IS NOT NULL AND DowntimeReason != '')
      )
    ontology_rule: "downtime_reason_required"
  
  valid_oee_calculation:
    type: "CHECK"
    table: "mes_data"
    sql: |
      CHECK (
        ABS(OEE_Score - (Availability_Score * Performance_Score * Quality_Score / 10000)) < 0.1
      )
    ontology_rule: "oee_calculation_valid"

# ====================================================================================
# INDEXES (For query performance)
# ====================================================================================
indexes:
  idx_timestamp:
    table: "mes_data"
    columns: ["Timestamp"]
    type: "BTREE"
    description: "For time-based queries"
  
  idx_equipment:
    table: "mes_data"
    columns: ["EquipmentID", "Timestamp"]
    type: "BTREE"
    description: "For equipment history queries"
  
  idx_line:
    table: "mes_data"
    columns: ["LineID", "Timestamp"]
    type: "BTREE"
    description: "For line performance queries"
  
  idx_status:
    table: "mes_data"
    columns: ["MachineStatus", "DowntimeReason"]
    type: "BTREE"
    description: "For downtime analysis"

# ====================================================================================
# STORED PROCEDURES (Common operations)
# ====================================================================================
procedures:
  calculate_line_oee:
    description: "Calculate OEE for a production line"
    parameters:
      - name: "line_id"
        type: "INTEGER"
      - name: "start_time"
        type: "DATETIME"
      - name: "end_time"
        type: "DATETIME"
    returns: "TABLE(oee DECIMAL, availability DECIMAL, performance DECIMAL, quality DECIMAL)"
    sql: |
      SELECT 
        AVG(OEE_Score) as oee,
        AVG(Availability_Score) as availability,
        AVG(Performance_Score) as performance,
        AVG(Quality_Score) as quality
      FROM mes_data
      WHERE LineID = :line_id
        AND Timestamp BETWEEN :start_time AND :end_time
  
  identify_bottlenecks:
    description: "Find bottleneck equipment"
    parameters:
      - name: "hours_back"
        type: "INTEGER"
        default: 24
    returns: "TABLE(EquipmentID VARCHAR, OEE DECIMAL, StopCount INTEGER)"
    sql: |
      SELECT 
        EquipmentID,
        AVG(OEE_Score) as OEE,
        COUNT(CASE WHEN MachineStatus = 'Stopped' THEN 1 END) as StopCount
      FROM mes_data
      WHERE Timestamp >= datetime('now', '-' || :hours_back || ' hours')
      GROUP BY EquipmentID
      ORDER BY OEE ASC
      LIMIT 5

# ====================================================================================
# DATA VALIDATION (Quality checks)
# ====================================================================================
validation:
  required_fields:
    - "Timestamp"
    - "EquipmentID"
    - "LineID"
    - "MachineStatus"
    - "GoodUnitsProduced"
    - "ScrapUnitsProduced"
    - "OEE_Score"
  
  data_quality_checks:
    timestamp_sequential:
      description: "Timestamps should increase monotonically"
      sql: |
        SELECT COUNT(*) as violations
        FROM mes_data m1
        JOIN mes_data m2 ON m1.EquipmentID = m2.EquipmentID
        WHERE m1.Timestamp > m2.Timestamp
          AND m1.ROWID < m2.ROWID
    
    oee_in_range:
      description: "OEE scores should be 0-100"
      sql: |
        SELECT COUNT(*) as violations
        FROM mes_data
        WHERE OEE_Score < 0 OR OEE_Score > 100
    
    production_non_negative:
      description: "Production counts should be non-negative"
      sql: |
        SELECT COUNT(*) as violations
        FROM mes_data
        WHERE GoodUnitsProduced < 0 OR ScrapUnitsProduced < 0

# ====================================================================================
# INTEGRATION (How to connect and use)
# ====================================================================================
integration:
  # For twin simulation
  twin_output:
    format: "CSV"
    path: "./data/simulation_output.csv"
    import_sql: |
      .mode csv
      .import ./data/simulation_output.csv mes_data
  
  # For real MES
  real_mes:
    format: "API"
    endpoint: "https://mes-system.example.com/api/snapshots"
    polling_interval: 300  # seconds
    
  # For analysis
  analytics:
    tools: ["Python pandas", "Jupyter notebooks", "Grafana"]
    connection_string: "sqlite:///data/mes_production.db"