# Twin Ontology Template
# Purpose: Declarative specification for SimPy manufacturing model generation
# This ontology IS the model - not configuration
# MUST align with MES ontology for semantic consistency

metadata:
  name: "<YOUR_TWIN_ONTOLOGY_NAME>"
  version: "1.0.0"
  description: "Declarative specification for SimPy discrete event simulation model"
  namespace: "twin"
  imports:
    - namespace: "mes"
      description: "Base MES ontology we generate data for"
      path: "./mes_ontology.yaml"
  author: "<YOUR_NAME>"
  created: "<YYYY-MM-DD>"

# TBox - Terminological Box (Classes and Hierarchies)
tbox:
  classes:
    # Core simulation entities
    Equipment:
      description: "Production equipment that processes materials"
      parent: "SimulationEntity"
      attributes:
        - id: string
        - type: EquipmentType
        - state: EquipmentState
        
    Buffer:
      description: "Storage location between equipment"
      parent: "SimulationEntity"
      attributes:
        - id: string
        - capacity: integer
        - current_level: integer
        
    ProductionLine:
      description: "Complete line with equipment and buffers"
      parent: "SimulationEntity"
      attributes:
        - id: string
        - equipment_sequence: list[Equipment]
        - buffer_sequence: list[Buffer]
        
    Material:
      description: "Units flowing through the system"
      parent: "SimulationEntity"
      attributes:
        - product_id: string
        - quantity: integer
        - quality_status: QualityStatus
        
  # Enumeration types
  enumerations:
    EquipmentType:
      values: ["<TYPE1>", "<TYPE2>", "<TYPE3>"]  # e.g., FILLER, PACKER, PALLETIZER
      
    EquipmentState:
      values: ["RUNNING", "STOPPED_FAILURE", "STOPPED_MAINTENANCE", "STARVED", "BLOCKED", "IDLE"]
      
    QualityStatus:
      values: ["GOOD", "SCRAP"]
      
    DowntimeReason:
      values: ["<REASON1>", "<REASON2>"]  # e.g., UNP-JAM, UNP-MECH, PL-CLEAN

# RBox - Relational Box (Relationships)
rbox:
  relationships:
    feeds_into:
      domain: Equipment
      range: Buffer
      cardinality: "1:1"
      description: "Equipment outputs to buffer"
      
    draws_from:
      domain: Equipment
      range: Buffer
      cardinality: "1:1"
      description: "Equipment inputs from buffer"
      
    contains:
      domain: ProductionLine
      range: Equipment
      cardinality: "1:n"
      description: "Line contains multiple equipment"

# Properties - Attributes and Constraints
properties:
  Equipment:
    base_rate:
      type: float
      unit: "units/minute"
      constraints:
        min: 1.0
        max: 1000.0
      description: "Nominal production rate"
      
    mtbf:
      type: float
      unit: "minutes"
      constraints:
        min: 60.0
        max: 10080.0  # Max 1 week
      description: "Mean time between failures"
      
    mttr:
      type: float
      unit: "minutes"
      constraints:
        min: 1.0
        max: 480.0  # Max 8 hours
      description: "Mean time to repair"
      
    base_scrap_rate:
      type: float
      unit: "probability"
      constraints:
        min: 0.0
        max: 0.2  # Max 20% scrap
      description: "Base probability of producing scrap"
      
  Buffer:
    capacity:
      type: integer
      unit: "units"
      constraints:
        min: 10
        max: 10000
      description: "Maximum buffer capacity"

# Model Definition - How to build the SimPy model
model_definition:
  lines:
    - line_id: "<LINE_ID>"  # e.g., LINE1
      equipment_sequence:
        - {id: "<EQ_ID>", type: "<TYPE>", base_rate: <RATE>, mtbf: <MTBF>, mttr: <MTTR>, base_scrap_rate: <SCRAP>}
        # Add more equipment...
      buffer_capacities: [<CAP1>, <CAP2>, <CAP3>]  # One more than equipment count
      source_arrival_rate: <RATE>  # units/minute

# Behavioral Rules - How components behave
behavioral_rules:
  equipment_state_transitions:
    RUNNING:
      on_failure: STOPPED_FAILURE
      on_maintenance: STOPPED_MAINTENANCE
      on_no_input: STARVED
      on_output_full: BLOCKED
      
    STOPPED_FAILURE:
      after_repair: RUNNING
      
    STOPPED_MAINTENANCE:
      after_maintenance: RUNNING
      
    STARVED:
      on_material_available: RUNNING
      
    BLOCKED:
      on_space_available: RUNNING
      
  failure_patterns:
    exponential_failures:
      description: "Failures follow exponential distribution"
      formula: "time_to_failure = exponential(1/MTBF)"
      
  maintenance_patterns:
    preventive_schedule:
      description: "Regular maintenance intervals"
      base_interval: 2880  # 48 hours in minutes
      duration: 60  # 1 hour maintenance

# Control Parameters - What operators can adjust
control_parameters:
  line_speed_setting:
    type: float
    range: [0.7, 1.2]
    default: 1.0
    description: "Equipment speed dial"
    
  preventive_maintenance_intensity:
    type: float
    range: [0.5, 2.0]
    default: 1.0
    description: "PM frequency multiplier"
    
  quality_threshold:
    type: float
    range: [0.8, 1.2]
    default: 1.0
    description: "QC strictness"
    
  operator_effectiveness:
    type: float
    range: [0.8, 1.2]
    default: 1.0
    description: "Skill/staffing level"
    
  buffer_management_strategy:
    type: string
    options: ["aggressive", "balanced", "conservative"]
    default: "balanced"
    description: "Buffer reaction strategy"

# Parameter Effects - How control parameters affect the model
parameter_effects:
  line_speed_setting:
    affects:
      - target: "equipment.production_rate"
        formula: "base_rate * line_speed_setting"
      - target: "equipment.jam_probability"
        formula: "0.01 * (line_speed_setting ** 2)"  # Quadratic increase
        
  preventive_maintenance_intensity:
    affects:
      - target: "equipment.mtbf"
        formula: "base_mtbf * preventive_maintenance_intensity"
      - target: "equipment.mttr"
        formula: "base_mttr * (2 - preventive_maintenance_intensity * 0.5)"
        
  quality_threshold:
    affects:
      - target: "equipment.scrap_rate"
        formula: "base_scrap_rate * quality_threshold"
        
  operator_effectiveness:
    affects:
      - target: "equipment.mttr"
        formula: "base_mttr / operator_effectiveness"
        
  buffer_management_strategy:
    affects:
      - target: "buffer.reaction_threshold"
        mapping:
          aggressive: 0.3
          balanced: 0.5
          conservative: 0.7

# Transduction Layer - How SimPy model maps to MES data
transduction_layer:
  mes_snapshot_interval: 5  # minutes
  
  equipment_state_mapping:
    RUNNING: "Running"
    STOPPED_FAILURE: "Stopped"
    STOPPED_MAINTENANCE: "Stopped"
    STARVED: "Stopped"
    BLOCKED: "Stopped"
    IDLE: "Idle"
    
  downtime_reason_mapping:
    STOPPED_FAILURE:
      jam: "<JAM_CODE>"  # e.g., UNP-JAM
      mechanical: "<MECH_CODE>"  # e.g., UNP-MECH
    STOPPED_MAINTENANCE:
      cleaning: "<CLEAN_CODE>"  # e.g., PL-CLEAN
    STARVED: ""
    BLOCKED: ""
    
  mes_record_structure:
    fields:
      - Timestamp: "datetime"
      - ProductionOrderID: "string"
      - LineID: "integer"
      - EquipmentID: "string"
      - EquipmentType: "string"
      - ProductID: "string"
      - ProductName: "string"
      - MachineStatus: "string"
      - DowntimeReason: "string"
      - GoodUnitsProduced: "integer"
      - ScrapUnitsProduced: "integer"
      - TargetRate_units_per_5min: "integer"
      - StandardCost_per_unit: "float"
      - SalePrice_per_unit: "float"
      - Availability_Score: "float"
      - Performance_Score: "float"
      - Quality_Score: "float"
      - OEE_Score: "float"
      
  oee_calculation:
    availability: "(running_time / planned_time) * 100"
    performance: "(actual_production / (running_time * ideal_rate / 12)) * 100"
    quality: "(good_units / (good_units + scrap_units)) * 100"
    oee: "(availability * performance * quality) / 10000"

# Simulation Configuration
simulation_config:
  duration_days: 7
  random_seed: 42
  warmup_period_hours: 24
  
# Product Definitions
products:
  - id: "<PRODUCT_ID>"  # e.g., SKU-2001
    name: "<PRODUCT_NAME>"  # e.g., 12oz Soda
    standard_cost: <COST>  # e.g., 0.20
    sale_price: <PRICE>  # e.g., 0.65
    target_rate_per_5min: <RATE>  # e.g., 475
    line_assignment: ["<LINE1>", "<LINE2>"]

# Production Orders Template
production_orders:
  order_pattern: "continuous"  # continuous, batch, or campaign
  order_duration_hours: 8
  changeover_time_minutes: 30